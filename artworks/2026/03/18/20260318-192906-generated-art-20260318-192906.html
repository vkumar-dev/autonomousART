<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Art 20260318_192906 - autonomousART</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050505;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      padding: 20px;
    }
    .container { max-width: 1200px; width: 100%; text-align: center; }
    .frame {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
      margin-bottom: 30px;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
    }
    .info {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 16px;
      max-width: 700px;
      margin: 0 auto;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { font-size: 16px; line-height: 1.7; opacity: 0.9; margin-bottom: 20px; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }
    .tag {
      background: rgba(255,255,255,0.1);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
    }
    .colors {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }
    .swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
    }
    .back {
      display: inline-block;
      margin-top: 25px;
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,0.1);
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 14px;
      transition: all 0.3s;
    }
    .back:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="frame">
      <canvas id="artCanvas" width="1024" height="1024"></canvas>
    </div>

    <div class="info">
      <h1>Generated Art 20260318_192906</h1>
      <p>abstract cosmic art</p>

      <div class="meta">
        <span class="tag">🎨 abstract</span>
        <span class="tag">🖼️ Animated</span>
      </div>

      <div class="colors">
        <div class="swatch" style="background:#667eea"></div><div class="swatch" style="background:#764ba2"></div><div class="swatch" style="background:#f093fb"></div><div class="swatch" style="background:#4facfe"></div><div class="swatch" style="background:#ff9a9e"></div>
      </div>
    </div>

    <a href="../index.html" class="back">← Back to Gallery</a>
  </div>

  <script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    const colors = ["#667eea","#764ba2","#f093fb","#4facfe","#ff9a9e"];
    const technique = 'abstract';

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    
    const elements = [];

    class Element {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = random(0, canvas.width);
        this.y = random(0, canvas.height);
        this.size = random(10, 80);
        this.type = randomChoice(['circle', 'rect', 'line']);
        this.color = randomChoice(colors);
        this.speedX = random(-0.3, 0.3);
        this.speedY = random(-0.3, 0.3);
        this.rotation = random(0, Math.PI * 2);
        this.rotSpeed = random(-0.02, 0.02);
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.rotation += this.rotSpeed;
        if (this.x < -100 || this.x > canvas.width + 100 ||
            this.y < -100 || this.y > canvas.height + 100) this.reset();
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.6;
        if (this.type === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.type === 'rect') {
          ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        } else if (this.type === 'line') {
          ctx.strokeStyle = this.color;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(-this.size / 2, 0);
          ctx.lineTo(this.size / 2, 0);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    function init() {
      for (let i = 0; i < 150; i++) elements.push(new Element());
      animate();
    }

    function animate() {
      ctx.fillStyle = 'rgba(5, 5, 10, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      elements.forEach(e => { e.update(); e.draw(); });
      requestAnimationFrame(animate);
    }
    

    init();
  </script>
</body>
</html>
