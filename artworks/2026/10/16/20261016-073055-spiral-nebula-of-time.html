<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiral Nebula of Time - autonomousART</title>
  <style>
    :root {
      --paper: #f2eee6;
      --ink: #1b1814;
      --ink-soft: #56504a;
      --ink-faint: #938c81;
      --line: rgba(27, 24, 20, 0.14);
      --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
      --sans: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 44px 26px 90px;
    }
    .page { width: 100%; max-width: 780px; }
    .work { width: 100%; }
    .plate {
      position: relative;
      width: 100%;
      background: #0f0f0d;
      line-height: 0;
      box-shadow: 0 1px 2px rgba(27,24,20,0.04), 0 40px 90px -48px rgba(27,24,20,0.5);
    }
    canvas { width: 100%; height: auto; display: block; }
    .caption { padding-top: 26px; }
    .kicker {
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 16px;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(25px, 5vw, 36px);
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
    }
    .desc {
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink-soft);
      max-width: 62ch;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 26px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .palette { display: inline-flex; gap: 7px; align-items: center; }
    .palette i {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(27,24,20,0.16);
    }
    .back {
      display: inline-block;
      margin-top: 40px;
      font-size: 10.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink);
      border-bottom: 1px solid var(--line);
      padding-bottom: 4px;
      transition: border-color 0.4s ease;
    }
    .back:hover { border-color: var(--ink); }

    /* #stage: frame-only mode used when the piece is embedded (thumbnails, viewing room) */
    html.stage body { padding: 0; display: block; }
    html.stage .page {
      width: 100%;
      max-width: none;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    html.stage .work { width: min(100vw, 100vh); }
    html.stage .plate { width: 100%; box-shadow: none; }
    html.stage .caption,
    html.stage .back { display: none; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
  <script>
    if (location.hash === '#stage') document.documentElement.classList.add('stage');
  </script>
</head>
<body>
  <div class="page">
    <figure class="work">
      <div class="plate">
        <canvas id="artCanvas" width="1024" height="1024"></canvas>
      </div>
      <figcaption class="caption">
        <p class="kicker" id="artAccession">Autonomous Art &middot; Generative</p>
        <h1>Spiral Nebula of Time</h1>
        <p class="desc">A dynamic spiral nebula unfolds through time, with neural wave harmonics generating flowing, pulsing patterns that evolve into hyperbolic lattices, creating a cosmic dance of mathematical elegance and fluid motion.</p>
        <div class="meta-row">
          <span>Neural Wave Harmonics</span>
          <span>Animated</span>
          <span class="palette"><i style="background:#001f3f"></i><i style="background:#004d99"></i><i style="background:#00b4d8"></i><i style="background:#ff6b6b"></i><i style="background:#ff9f30"></i></span>
        </div>
      </figcaption>
    </figure>
    <a class="back" href="../../../../index.html">&larr; Return to collection</a>
  </div>

  <script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const colors = ["#001f3f","#004d99","#00b4d8","#ff6b6b","#ff9f30"];
    const technique = 'neural wave harmonics';

    // Allow AI models querying document.getElementById('canvas') or 'artCanvas' to succeed
    const _origGetElementById = document.getElementById.bind(document);
    document.getElementById = function(id) {
      if (id === 'canvas' || id === 'artCanvas') return canvas;
      return _origGetElementById(id);
    };

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    
    // --- AI-GENERATED CANVAS CODE (watchdog-guarded) ---
    (function() {
      // The AI writes arbitrary code, so before trusting its output we probe the
      // real canvas pixels. If the code throws OR leaves the canvas effectively
      // blank after a few animation frames, we stop its loop and run the proven
      // procedural engine instead. This prevents silently-deployed black pages.
      const nativeRaf = (typeof window !== 'undefined' && window.requestAnimationFrame)
        ? window.requestAnimationFrame.bind(window)
        : null;

      const frameQueue = [];
      let scheduled = false;
      let phase = 'probing';   // 'probing' -> 'running' (AI kept) | 'fallback'
      let probeFrames = 0;
      let frameTime = 0;
      const PROBE_FRAMES = 12;

      function schedule() {
        if (scheduled || !nativeRaf) return;
        scheduled = true;
        nativeRaf(flush);
      }

      // Intercept rAF so we can count frames for the probe and, when needed,
      // fully stop the AI animation before the fallback engine starts.
      window.requestAnimationFrame = function(cb) {
        frameQueue.push(cb);
        schedule();
        return 0;
      };
      window.cancelAnimationFrame = function() {};

      function flush() {
        scheduled = false;
        frameTime += 16;
        const cbs = frameQueue.splice(0, frameQueue.length);
        for (let i = 0; i < cbs.length; i++) {
          try { cbs[i](frameTime); } catch (e) { console.error('Animation frame error:', e); }
        }
        if (phase === 'probing') {
          probeFrames++;
          if (probeFrames >= PROBE_FRAMES) decide();
        }
        if (phase === 'probing') {
          if (!scheduled) schedule();
        } else if ((phase === 'running' || phase === 'fallback') && frameQueue.length > 0 && !scheduled) {
          schedule();
        }
      }

      function isCanvasBlank() {
        try {
          const img = ctx.getImageData(0, 0, width, height);
          const d = img.data;
          const step = 32;
          for (let y = 0; y < height; y += step) {
            for (let x = 0; x < width; x += step) {
              const i = (y * width + x) * 4;
              // Visible = any non-transparent pixel that is not near-black.
              if (d[i + 3] > 0 && (d[i] + d[i + 1] + d[i + 2]) > 30) return false;
            }
          }
          return true;
        } catch (e) {
          return false; // pixels unreadable (rare); assume the code drew something
        }
      }

      function runFallback(reason) {
        console.log('Falling back to procedural engine (' + reason + ')...');
        phase = 'fallback';
        frameQueue.length = 0; // halt the AI animation loop
        ctx.clearRect(0, 0, width, height);
        // Own scope: declarations can never collide with the AI code's names
        // (a collision would be a parse-time SyntaxError no try/catch can catch).
        (function() {
          
    const numParticles = 600;
    const particles = [];
    let t = 0;

    class StreamParticle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = random(0, width);
        this.y = random(0, height);
        this.prevX = this.x;
        this.prevY = this.y;
        this.speed = random(1.5, 3.5);
        this.color = randomChoice(colors);
        this.life = random(60, 200);
      }
      update() {
        this.prevX = this.x;
        this.prevY = this.y;
        const angle = Math.sin(this.y * 0.005 + t) * Math.PI * 2 + Math.cos(this.x * 0.005 - t) * Math.PI;
        this.x += Math.cos(angle) * this.speed;
        this.y += Math.sin(angle) * this.speed;
        this.life--;
        if (this.life <= 0 || this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
          this.reset();
        }
      }
      draw() {
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(this.prevX, this.prevY);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();
      }
    }

    function init() {
      ctx.fillStyle = '#07070d';
      ctx.fillRect(0, 0, width, height);
      for (let i = 0; i < numParticles; i++) particles.push(new StreamParticle());
      animate();
    }

    function animate() {
      ctx.fillStyle = 'rgba(7, 7, 13, 0.03)';
      ctx.fillRect(0, 0, width, height);
      particles.forEach(p => { p.update(); p.draw(); });
      t += 0.004;
      requestAnimationFrame(animate);
    }
    
          if (typeof init === 'function') {
            init();
          }
        })();
        if (frameQueue.length > 0 && !scheduled) schedule();
      }

      function decide() {
        if (isCanvasBlank()) {
          runFallback('AI code left the canvas blank');
        } else {
          phase = 'running';
        }
      }

      let customSucceeded = false;
      try {
        // Run the AI code in its own scope so its top-level declarations can
        // never collide with the watchdog's own identifiers.
        (function() {
          let particles = [];
let wavePhase = 0;
let time = 0;

function setup() {
  const w = width;
  const h = height;
  const center = { x: w / 2, y: h / 2 };
  const radius = Math.min(w, h) * 0.4;

  // Create hyperbolic spiral particles with neural wave harmonics
  for (let i = 0; i < 200; i++) {
    const angle = (i / 200) * Math.PI * 2;
    const r = radius * (1 + 0.2 * Math.sin(angle * 3));
    const x = center.x + r * Math.cos(angle);
    const y = center.y + r * Math.sin(angle);

    particles.push({
      x,
      y,
      vx: 0.01 * (Math.sin(angle * 2) + 0.5),
      vy: 0.01 * (Math.cos(angle * .5) + 0.5),
      phase: random(0, 10),
      radius: random(1, 8),
      color: colors[Math.floor(random(0, 5))]
    });
  }
}

function draw() {
  const ctx = this.ctx;
  const w = width;
  const h = height;
  const center = { x: w / 2, y: h / 2 };

  // Clear canvas with a subtle gradient background
  const gradient = ctx.createRadialGradient(center.x, center.y, 0, center.x, center.y, Math.max(w, h));
  gradient.addColorStop(0, '#000022');
  gradient.addColorStop(1, '#001f3f');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, w, h);

  wavePhase += 0.01;
  time += 0.01;

  // Draw hyperbolic spiral waveforms using neural wave harmonics
  ctx.strokeStyle = 'rgba(0, 100, 255, 0.3)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 100; i++) {
    const angle = (i / 100) * Math.PI * 2;
    const r = Math.max(w, h) * 0.2 * (1 + 0.5 * Math.sin(angle * 3));
    const x = center.x + r * Math.cos(angle);
    const y = center.y + r * Math.sin(angle);

    const waveStrength = 0.5 + 0.5 * Math.sin(wavePhase + angle * 1.2);
    const xOffset = waveStrength * Math.sin(angle * 2.5) * 10;
    const yOffset = waveStrength * Math.cos(angle * 1.8) * 10;

    const finalX = x + xOffset;
    const finalY = y + yOffset;

    if (i === 0) {
      ctx.moveTo(finalX, finalY);
    } else {
      ctx.lineTo(finalX, finalY);
    }
  }
  ctx.stroke();

  // Draw pulsing neural wave particles
  particles.forEach(p => {
    const phase = p.phase + time * 0.1;
    const wave = 0.8 + 0.2 * Math.sin(phase * 2 + wavePhase);
    const pulse = 0.5 + 0.5 * Math.sin(phase + wavePhase * 1.5);

    const x = p.x + p.vx * time * 10;
    const y = p.y + p.vy * time * 10;

    const amplitude = p.radius * wave;
    const offsetX = amplitude * Math.sin(p.phase * 2 + wavePhase * 1.2);
    const offsetY = amplitude * Math.cos(p.phase * 1.8 + wavePhase * 0.9);

    const finalX = x + offsetX;
    const finalY = y + offsetY;

    ctx.save();
    ctx.translate(finalX, finalY);
    ctx.rotate(p.phase * 0.02);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // Add subtle glow effects at spiral nodes
  for (let i = 0; i < 10; i++) {
    const angle = (i / 10) * Math.PI * 2;
    const r = Math.max(w, h) * 0.2;
    const x = center.x + r * Math.cos(angle);
    const y = center.y + r * Math.sin(angle);

    const glow = 0.5 * Math.sin(wavePhase + angle * 3);
    ctx.globalAlpha = 0.3 + glow * 0.3;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.beginPath();
    ctx.arc(x, y, 15, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

// Initialize
setup();
draw();
          if (typeof init === 'function') {
            init();
          }
        })();
        customSucceeded = true;
      } catch (err) {
        console.error('Custom AI art execution error:', err);
      }

      if (!customSucceeded) {
        runFallback('AI code threw an error');
      } else if (frameQueue.length === 0) {
        // No animation requested: judge the synchronous drawing right away.
        if (isCanvasBlank()) runFallback('AI code left the canvas blank');
        else phase = 'running';
      } else if (!nativeRaf) {
        phase = 'running'; // can't probe without rAF; keep whatever ran
      } else {
        schedule(); // animate, then probe the pixels after a few frames
      }
    })();
    

    // Accession caption: derive the display date from this file's timestamp.
    try {
      const m = /([0-9]{8})-([0-9]{6})-([^/]+)[.]html$/.exec(location.pathname);
      if (m) {
        const d = new Date(+m[1].slice(0, 4), +m[1].slice(4, 6) - 1, +m[1].slice(6, 8));
        const el = document.getElementById('artAccession');
        if (el) el.textContent = 'Autonomous Art · ' + d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
      }
    } catch (e) {}
  </script>
</body>
</html>
