<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fractal Lullaby of Infinity - autonomousART</title>
  <style>
    :root {
      --paper: #f2eee6;
      --ink: #1b1814;
      --ink-soft: #56504a;
      --ink-faint: #938c81;
      --line: rgba(27, 24, 20, 0.14);
      --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
      --sans: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 44px 26px 90px;
    }
    .page { width: 100%; max-width: 780px; }
    .work { width: 100%; }
    .plate {
      position: relative;
      width: 100%;
      background: #0f0f0d;
      line-height: 0;
      box-shadow: 0 1px 2px rgba(27,24,20,0.04), 0 40px 90px -48px rgba(27,24,20,0.5);
    }
    canvas { width: 100%; height: auto; display: block; }
    .caption { padding-top: 26px; }
    .kicker {
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 16px;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(25px, 5vw, 36px);
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
    }
    .desc {
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink-soft);
      max-width: 62ch;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 26px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .palette { display: inline-flex; gap: 7px; align-items: center; }
    .palette i {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(27,24,20,0.16);
    }
    .back {
      display: inline-block;
      margin-top: 40px;
      font-size: 10.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink);
      border-bottom: 1px solid var(--line);
      padding-bottom: 4px;
      transition: border-color 0.4s ease;
    }
    .back:hover { border-color: var(--ink); }

    /* #stage: frame-only mode used when the piece is embedded (thumbnails, viewing room) */
    html.stage body { padding: 0; display: block; }
    html.stage .page {
      width: 100%;
      max-width: none;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    html.stage .work { width: min(100vw, 100vh); }
    html.stage .plate { width: 100%; box-shadow: none; }
    html.stage .caption,
    html.stage .back { display: none; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
  <script>
    if (location.hash === '#stage') document.documentElement.classList.add('stage');
  </script>
</head>
<body>
  <div class="page">
    <figure class="work">
      <div class="plate">
        <canvas id="artCanvas" width="1024" height="1024"></canvas>
      </div>
      <figcaption class="caption">
        <p class="kicker" id="artAccession">Autonomous Art &middot; Generative</p>
        <h1>Fractal Lullaby of Infinity</h1>
        <p class="desc">A swirling, recursive lattice of hyperbolic spirals evolves through time, each iteration folding into itself like a living mandala. The motion emerges from a hybrid of phyllotaxis and non-ergodic hyperbolic geometry, creating a sense of infinite recursion and silent resonance.</p>
        <div class="meta-row">
          <span>Hyperbolic Lattice with Phyllotaxis Spiral Modulation</span>
          <span>Animated</span>
          <span class="palette"><i style="background:#0a2e6c"></i><i style="background:#3a86c7"></i><i style="background:#8a2be2"></i><i style="background:#f5a623"></i><i style="background:#e63946"></i></span>
        </div>
      </figcaption>
    </figure>
    <a class="back" href="../../../../index.html">&larr; Return to collection</a>
  </div>

  <script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const colors = ["#0a2e6c","#3a86c7","#8a2be2","#f5a623","#e63946"];
    const technique = 'hyperbolic lattice with phyllotaxis spiral modulation';

    // Allow AI models querying document.getElementById('canvas') or 'artCanvas' to succeed
    const _origGetElementById = document.getElementById.bind(document);
    document.getElementById = function(id) {
      if (id === 'canvas' || id === 'artCanvas') return canvas;
      return _origGetElementById(id);
    };

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    
    // --- AI-GENERATED CANVAS CODE (watchdog-guarded) ---
    (function() {
      // The AI writes arbitrary code, so before trusting its output we probe the
      // real canvas pixels. If the code throws OR leaves the canvas effectively
      // blank after a few animation frames, we stop its loop and run the proven
      // procedural engine instead. This prevents silently-deployed black pages.
      const nativeRaf = (typeof window !== 'undefined' && window.requestAnimationFrame)
        ? window.requestAnimationFrame.bind(window)
        : null;

      const frameQueue = [];
      let scheduled = false;
      let phase = 'probing';   // 'probing' -> 'running' (AI kept) | 'fallback'
      let probeFrames = 0;
      let frameTime = 0;
      const PROBE_FRAMES = 12;

      function schedule() {
        if (scheduled || !nativeRaf) return;
        scheduled = true;
        nativeRaf(flush);
      }

      // Intercept rAF so we can count frames for the probe and, when needed,
      // fully stop the AI animation before the fallback engine starts.
      window.requestAnimationFrame = function(cb) {
        frameQueue.push(cb);
        schedule();
        return 0;
      };
      window.cancelAnimationFrame = function() {};

      function flush() {
        scheduled = false;
        frameTime += 16;
        const cbs = frameQueue.splice(0, frameQueue.length);
        for (let i = 0; i < cbs.length; i++) {
          try { cbs[i](frameTime); } catch (e) { console.error('Animation frame error:', e); }
        }
        if (phase === 'probing') {
          probeFrames++;
          if (probeFrames >= PROBE_FRAMES) decide();
        }
        if (phase === 'probing') {
          if (!scheduled) schedule();
        } else if ((phase === 'running' || phase === 'fallback') && frameQueue.length > 0 && !scheduled) {
          schedule();
        }
      }

      function isCanvasBlank() {
        try {
          const img = ctx.getImageData(0, 0, width, height);
          const d = img.data;
          const step = 32;
          for (let y = 0; y < height; y += step) {
            for (let x = 0; x < width; x += step) {
              const i = (y * width + x) * 4;
              // Visible = any non-transparent pixel that is not near-black.
              if (d[i + 3] > 0 && (d[i] + d[i + 1] + d[i + 2]) > 30) return false;
            }
          }
          return true;
        } catch (e) {
          return false; // pixels unreadable (rare); assume the code drew something
        }
      }

      function runFallback(reason) {
        console.log('Falling back to procedural engine (' + reason + ')...');
        phase = 'fallback';
        frameQueue.length = 0; // halt the AI animation loop
        ctx.clearRect(0, 0, width, height);
        // Own scope: declarations can never collide with the AI code's names
        // (a collision would be a parse-time SyntaxError no try/catch can catch).
        (function() {
          
    let n = 0;
    const c = 7;
    const maxPoints = 2500;
    let t = 0;

    function init() {
      ctx.fillStyle = '#040407';
      ctx.fillRect(0, 0, width, height);
      animate();
    }

    function animate() {
      ctx.fillStyle = 'rgba(4, 4, 7, 0.02)';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(width / 2, height / 2);
      ctx.rotate(t * 0.05);

      const goldenAngle = 137.5 * (Math.PI / 180);
      for (let i = 0; i < 60; i++) {
        const idx = (n + i) % maxPoints;
        const a = idx * goldenAngle + t;
        const r = c * Math.sqrt(idx) + Math.sin(idx * 0.1 + t) * 10;
        const x = r * Math.cos(a);
        const y = r * Math.sin(a);

        const color = colors[idx % colors.length];
        ctx.fillStyle = color;
        ctx.beginPath();
        const size = (1 - (r / (width * 0.5))) * 6 + 1;
        ctx.arc(x, y, Math.max(1, size), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      n = (n + 60) % maxPoints;
      t += 0.015;
      requestAnimationFrame(animate);
    }
    
          if (typeof init === 'function') {
            init();
          }
        })();
        if (frameQueue.length > 0 && !scheduled) schedule();
      }

      function decide() {
        if (isCanvasBlank()) {
          runFallback('AI code left the canvas blank');
        } else {
          phase = 'running';
        }
      }

      let customSucceeded = false;
      try {
        // Run the AI code in its own scope so its top-level declarations can
        // never collide with the watchdog's own identifiers.
        (function() {
          // Hyperbolic lattice with phyllotaxis spiral modulation — a fractal lullaby of infinite recursion
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const width = 1024, height = 1024;
const colors = ['#0a2e6c', '#3a86cinois', '#8a2be2', '#f5a623', '#e63946'];
const centerX = width / 2;
const centerY = height / 2;
const maxIterations = 1000;

// Initialize system parameters
let t = 0;
let spiralParams = { phi: 1.618, scale: 0.99, angleStep: 0.005 };
let latticePoints = [];

function createHyperbolicSpiral(phi, scale, iterations) {
  const points = [];
  const baseAngle = Math.PI / 4;
  for (let i = 0; i < iterations; i++) {
    const r = (i + 1) * (1 + 0.001 * i) * scale ** i;
    const angle = baseAngle + i * phi * 0.01;
    const x = centerX + r * Math.cos(angle);
    const y = centerY + r * Math.sin(angle);
    points.push({ x, y });
  }
  return points;
}

function generateLatticeFractal() {
  latticePoints = [];
  for (let i = 0; i < 16; i++) {
    const spiral = createHyperbolicSpiral(spiralParams.phi, spiralParams.scale, 64);
    spiral.forEach(p => {
      latticePoints.push({ ...p });
      // Add recursive folds via reflection
      const reflected = { 
        x: 2 * centerX - p.x,
        y: 2 * centerY - p.y 
      };
      latticePoints.push(reflected);
    });
    // Apply phyllotaxis modulation to angle progression
    spiralParams.phi += 0.0005;
    spiralParams.scale *= 0.9998;
  }
}

function drawFractal() {
  ctx.clearRect(0, 0, width, height);
  
  // Background gradient
  const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(width, height) * 0.7);
  gradient.addColorStop(0, colors[0]);
  gradient.addColorStop(0.5, colors[2]);
  gradient.addColorStop(1, colors[4]);
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);
  
  // Draw lattice with dynamic color cycling
  const hueOffset = (t * 0.001) % 360;
  let hueIndex = Math.floor((t % 100) / 20);
  
  latticePoints.forEach((point, i) => {
    const c = colors[(hueIndex + i % 5) % 5];
    const size = 1 + (Math.sin(t * 0.0001 + i) * 0.3) * 2;
    
    // Apply subtle distortion based on hyperbolic distance
    const dx = point.x - centerX;
    const dy = point.y - centerY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    const distortion = Math.sin(t * 0.0002 + i * 0.01) * 0.05;
    const xDist = dx * distortion;
    const yDist = dy * distortion;
    
    ctx.save();
    ctx.translate(point.x + xDist, point.y + yDist);
    ctx.rotate(t * 0.0001 + i * 0.0005);
    
    ctx.beginPath();
    ctx.arc(0, 0, size, 0, Math.PI * 2);
    ctx.strokeStyle = c;
    ctx.lineWidth = 1 + (Math.sin(t * 0.0003 + i) * 0.5);
    ctx.stroke();
    
    ctx.restore();
    
    // Add faint spiral tracing
    if (i % 3 === 0) {
      ctx.beginPath();
      ctx.moveTo(point.x, point.y);
      ctx.lineTo(point.x + 10 * Math.cos(t * 0.0001), point.y + 10 * Math.sin(t * 0.0001));
      ctx.strokeStyle = colors[3];
      ctx.lineWidth = 0.5;
      ctx.setLineDash([5, 5]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  });
  
  // Overlay faint harmonic pattern from phyllotaxis
  for (let i = 0; i < 5; i++) {
    const angle = t * 0.0001 + i * 0.1;
    const r = 100 + Math.sin(t * 0.00005 + i) * 50;
    const x = centerX + r * Math.cos(angle);
    const y = centerY + r * Math.sin(angle);
    
    ctx.beginPath();
    ctx.arc(x, y, 2, 0, Math.PI * 2);
    ctx.strokeStyle = colors[(i + 1) % 5];
    ctx.lineWidth = 0.3;
    ctx.stroke();
  }
  
  t += 0.001;
}

function animate() {
  requestAnimationFrame(animate);
  generateLatticeFractal();
  drawFractal();
}

animate();
          if (typeof init === 'function') {
            init();
          }
        })();
        customSucceeded = true;
      } catch (err) {
        console.error('Custom AI art execution error:', err);
      }

      if (!customSucceeded) {
        runFallback('AI code threw an error');
      } else if (frameQueue.length === 0) {
        // No animation requested: judge the synchronous drawing right away.
        if (isCanvasBlank()) runFallback('AI code left the canvas blank');
        else phase = 'running';
      } else if (!nativeRaf) {
        phase = 'running'; // can't probe without rAF; keep whatever ran
      } else {
        schedule(); // animate, then probe the pixels after a few frames
      }
    })();
    

    // Accession caption: derive the display date from this file's timestamp.
    try {
      const m = /([0-9]{8})-([0-9]{6})-([^/]+)[.]html$/.exec(location.pathname);
      if (m) {
        const d = new Date(+m[1].slice(0, 4), +m[1].slice(4, 6) - 1, +m[1].slice(6, 8));
        const el = document.getElementById('artAccession');
        if (el) el.textContent = 'Autonomous Art · ' + d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
      }
    } catch (e) {}
  </script>
</body>
</html>
