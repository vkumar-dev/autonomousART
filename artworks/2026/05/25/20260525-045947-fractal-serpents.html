<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fractal Serpents - autonomousART</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050505;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      padding: 20px;
    }
    .container { max-width: 1200px; width: 100%; text-align: center; }
    .frame {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
      margin-bottom: 30px;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
    }
    .info {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 16px;
      max-width: 700px;
      margin: 0 auto;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #2B4B76, #80C1FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { font-size: 16px; line-height: 1.7; opacity: 0.9; margin-bottom: 20px; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }
    .tag {
      background: rgba(255,255,255,0.1);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
    }
    .colors {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }
    .swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
    }
    .back {
      display: inline-block;
      margin-top: 25px;
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,0.1);
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 14px;
      transition: all 0.3s;
    }
    .back:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="frame">
      <canvas id="artCanvas" width="1024" height="1024"></canvas>
    </div>

    <div class="info">
      <h1>Fractal Serpents</h1>
      <p>A swirling mass of lines that form intricate patterns reminiscent of fractals, suggesting a sense of growth and complexity.</p>

      <div class="meta">
        <span class="tag">🎨 Fractal Mathematics</span>
        <span class="tag">🖼️ Animated</span>
      </div>

      <div class="colors">
        <div class="swatch" style="background:#2B4B76"></div><div class="swatch" style="background:#80C1FF"></div><div class="swatch" style="background:#009EBC"></div><div class="swatch" style="background:#005DA7"></div>
      </div>
    </div>

    <a href="../index.html" class="back">← Back to Gallery</a>
  </div>

  <script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    const colors = ["#2B4B76","#80C1FF","#009EBC","#005DA7"];
    const technique = 'fractal mathematics';

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    
    let zoom = 1, offsetX = 0, offsetY = 0;
    const maxIter = 100;

    function mandelbrot(cx, cy) {
      let x = 0, y = 0, x2 = 0, y2 = 0, iter = 0;
      while (x2 + y2 <= 4 && iter < maxIter) {
        y = 2 * x * y + cy;
        x = x2 - y2 + cx;
        x2 = x * x;
        y2 = y * y;
        iter++;
      }
      return iter;
    }

    function draw() {
      const w = canvas.width, h = canvas.height;
      const imgData = ctx.createImageData(w, h);
      
      for (let py = 0; py < h; py++) {
        for (let px = 0; px < w; px++) {
          const x0 = (px - w / 2) / (0.5 * zoom * w) + offsetX;
          const y0 = (py - h / 2) / (0.5 * zoom * h) + offsetY;
          const iter = mandelbrot(x0, y0);
          const idx = (py * w + px) * 4;
          
          if (iter === maxIter) {
            imgData.data[idx] = imgData.data[idx+1] = imgData.data[idx+2] = 0;
          } else {
            const t = iter / maxIter;
            const color = colors[Math.floor(t * colors.length) % colors.length];
            imgData.data[idx] = parseInt(color.slice(1, 3), 16);
            imgData.data[idx + 1] = parseInt(color.slice(3, 5), 16);
            imgData.data[idx + 2] = parseInt(color.slice(5, 7), 16);
          }
          imgData.data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    let frame = 0;
    function animate() {
      zoom = 1 + Math.sin(frame * 0.01) * 0.5;
      offsetX = Math.cos(frame * 0.005) * 0.5;
      offsetY = Math.sin(frame * 0.005) * 0.5;
      draw();
      frame++;
      requestAnimationFrame(animate);
    }

    function init() {
      animate();
    }
    

    init();
  </script>
</body>
</html>
