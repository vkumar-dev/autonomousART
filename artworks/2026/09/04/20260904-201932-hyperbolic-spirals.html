<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperbolic Spirals - autonomousART</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050505;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      padding: 20px;
    }
    .container { max-width: 1200px; width: 100%; text-align: center; }
    .frame {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
      margin-bottom: 30px;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
    }
    .info {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 16px;
      max-width: 700px;
      margin: 0 auto;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #082042, #244268);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { font-size: 16px; line-height: 1.7; opacity: 0.9; margin-bottom: 20px; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }
    .tag {
      background: rgba(255,255,255,0.1);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
    }
    .colors {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }
    .swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
    }
    .back {
      display: inline-block;
      margin-top: 25px;
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,0.1);
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 14px;
      transition: all 0.3s;
    }
    .back:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="frame">
      <canvas id="artCanvas" width="1024" height="1024"></canvas>
    </div>

    <div class="info">
      <h1>Hyperbolic Spirals</h1>
      <p>This artwork explores the intersection of sacred geometry and chaotic fluid dynamics, visualizing the swirling patterns of hyperbolic spirals generated by the Lorenz system.</p>

      <div class="meta">
        <span class="tag">🎨 Hyperbolic Kaleidoscope</span>
        <span class="tag">🖼️ Animated</span>
        <span class="tag">✨ AI Code</span>
      </div>

      <div class="colors">
        <div class="swatch" style="background:#082042"></div><div class="swatch" style="background:#244268"></div><div class="swatch" style="background:#3A5F84"></div><div class="swatch" style="background:#527598"></div><div class="swatch" style="background:#6890AB"></div>
      </div>
    </div>

    <a href="../index.html" class="back">← Back to Gallery</a>
  </div>

  <script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const colors = ["#082042","#244268","#3A5F84","#527598","#6890AB"];
    const technique = 'hyperbolic kaleidoscope';

    // Allow AI models querying document.getElementById('canvas') or 'artCanvas' to succeed
    const _origGetElementById = document.getElementById.bind(document);
    document.getElementById = function(id) {
      if (id === 'canvas' || id === 'artCanvas') return canvas;
      return _origGetElementById(id);
    };

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    
    // --- AI-GENERATED CANVAS CODE ---
    (function() {
      let customSucceeded = false;
      try {
        // Animation using the Lissajous patterns with a chaotic system to create a hyperbolic kaleidoscope effect on the canvas.
// The animation loops continuously using requestAnimationFrame for a smooth and engaging user experience.

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = 1024;
canvas.height = 1024;

// Initialize the chaotic Lissajous system
let x = 0.0;
let y = 0.0;
let a = 1.0;
let b = 1.0;
let k = 1.0;
let l = 1.0;
let t = 0;

const colors = ['#082042', '#244268', '#3A5F84', '#527598', '#6890AB'];

function lissajous() {
  x += Math.sin(k * t) * a;
  y += Math.sin(l * t) * b;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = colors[randomChoice(colors)];
  ctx.fillRect(x, y, 1, 1);
  
  t += 0.1;
  requestAnimationFrame(lissajous);
}

function randomChoice(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

lissajous();
        if (typeof init === 'function') {
          init();
        }
        customSucceeded = true;
      } catch (err) {
        console.error('Custom AI art execution error:', err);
      }

      if (!customSucceeded) {
        console.log('Falling back to procedural engine...');
        // Run the procedural engine in its own scope: if its declarations were
        // hoisted next to the AI code's, a name collision would be a parse-time
        // SyntaxError (unreachable by try/catch) and blank the whole canvas.
        (function() {
          
    let t = 0;
    const folds = Math.floor(random(6, 12));

    function init() {
      animate();
    }

    function animate() {
      ctx.fillStyle = 'rgba(5, 5, 8, 0.08)';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(width / 2, height / 2);

      const angleStep = (Math.PI * 2) / folds;
      for (let fold = 0; fold < folds; fold++) {
        ctx.save();
        ctx.rotate(fold * angleStep + t * 0.01);
        if (fold % 2 === 1) ctx.scale(1, -1);

        for (let r = 50; r < 400; r += 40) {
          const wave = Math.sin(r * 0.03 + t) * 35;
          const color = colors[Math.floor(r * 0.1) % colors.length];

          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(r, wave, 20 + Math.cos(t + r) * 10, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = color;
          ctx.globalAlpha = 0.5;
          ctx.fillRect(r + wave, wave, 6, 6);
        }
        ctx.restore();
      }
      ctx.restore();

      t += 0.02;
      requestAnimationFrame(animate);
    }
    
          if (typeof init === 'function') {
            init();
          }
        })();
      }
    })();
    
  </script>
</body>
</html>
