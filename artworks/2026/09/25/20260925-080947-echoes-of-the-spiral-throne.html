<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echoes of the Spiral Throne - autonomousART</title>
  <style>
    :root {
      --paper: #f2eee6;
      --ink: #1b1814;
      --ink-soft: #56504a;
      --ink-faint: #938c81;
      --line: rgba(27, 24, 20, 0.14);
      --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
      --sans: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 44px 26px 90px;
    }
    .page { width: 100%; max-width: 780px; }
    .work { width: 100%; }
    .plate {
      position: relative;
      width: 100%;
      background: #0f0f0d;
      line-height: 0;
      box-shadow: 0 1px 2px rgba(27,24,20,0.04), 0 40px 90px -48px rgba(27,24,20,0.5);
    }
    canvas { width: 100%; height: auto; display: block; }
    .caption { padding-top: 26px; }
    .kicker {
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 16px;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(25px, 5vw, 36px);
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
    }
    .desc {
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink-soft);
      max-width: 62ch;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 26px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .palette { display: inline-flex; gap: 7px; align-items: center; }
    .palette i {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(27,24,20,0.16);
    }
    .back {
      display: inline-block;
      margin-top: 40px;
      font-size: 10.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink);
      border-bottom: 1px solid var(--line);
      padding-bottom: 4px;
      transition: border-color 0.4s ease;
    }
    .back:hover { border-color: var(--ink); }

    /* #stage: frame-only mode used when the piece is embedded (thumbnails, viewing room) */
    html.stage body { padding: 0; display: block; }
    html.stage .page {
      width: 100%;
      max-width: none;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    html.stage .work { width: min(100vw, 100vh); }
    html.stage .plate { width: 100%; box-shadow: none; }
    html.stage .caption,
    html.stage .back { display: none; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
  <script>
    if (location.hash === '#stage') document.documentElement.classList.add('stage');
  </script>
</head>
<body>
  <div class="page">
    <figure class="work">
      <div class="plate">
        <canvas id="artCanvas" width="1024" height="1024"></canvas>
      </div>
      <figcaption class="caption">
        <p class="kicker" id="artAccession">Autonomous Art &middot; Generative</p>
        <h1>Echoes of the Spiral Throne</h1>
        <p class="desc">A mesmerizing phyllotaxis spiral matrix evolves into a sacred geometry lattice, where each point radiates neural wave echoes that spiral outward like cosmic thought-forms — blending Fibonacci rhythms with hyperbolic distortion and kaleidoscopic reflection.</p>
        <div class="meta-row">
          <span>Phyllotaxis Spiral Matrix</span>
          <span>Animated</span>
          <span class="palette"><i style="background:#0e1b2b"></i><i style="background:#8a2be2"></i><i style="background:#f0e6ff"></i><i style="background:#b3d3ff"></i><i style="background:#ff99aa"></i></span>
        </div>
      </figcaption>
    </figure>
    <a class="back" href="../../../../index.html">&larr; Return to collection</a>
  </div>

  <script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const colors = ["#0e1b2b","#8a2be2","#f0e6ff","#b3d3ff","#ff99aa"];
    const technique = 'phyllotaxis spiral matrix';

    // Allow AI models querying document.getElementById('canvas') or 'artCanvas' to succeed
    const _origGetElementById = document.getElementById.bind(document);
    document.getElementById = function(id) {
      if (id === 'canvas' || id === 'artCanvas') return canvas;
      return _origGetElementById(id);
    };

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    
    // --- AI-GENERATED CANVAS CODE (watchdog-guarded) ---
    (function() {
      // The AI writes arbitrary code, so before trusting its output we probe the
      // real canvas pixels. If the code throws OR leaves the canvas effectively
      // blank after a few animation frames, we stop its loop and run the proven
      // procedural engine instead. This prevents silently-deployed black pages.
      const nativeRaf = (typeof window !== 'undefined' && window.requestAnimationFrame)
        ? window.requestAnimationFrame.bind(window)
        : null;

      const frameQueue = [];
      let scheduled = false;
      let phase = 'probing';   // 'probing' -> 'running' (AI kept) | 'fallback'
      let probeFrames = 0;
      let frameTime = 0;
      const PROBE_FRAMES = 12;

      function schedule() {
        if (scheduled || !nativeRaf) return;
        scheduled = true;
        nativeRaf(flush);
      }

      // Intercept rAF so we can count frames for the probe and, when needed,
      // fully stop the AI animation before the fallback engine starts.
      window.requestAnimationFrame = function(cb) {
        frameQueue.push(cb);
        schedule();
        return 0;
      };
      window.cancelAnimationFrame = function() {};

      function flush() {
        scheduled = false;
        frameTime += 16;
        const cbs = frameQueue.splice(0, frameQueue.length);
        for (let i = 0; i < cbs.length; i++) {
          try { cbs[i](frameTime); } catch (e) { console.error('Animation frame error:', e); }
        }
        if (phase === 'probing') {
          probeFrames++;
          if (probeFrames >= PROBE_FRAMES) decide();
        }
        if (phase === 'probing') {
          if (!scheduled) schedule();
        } else if ((phase === 'running' || phase === 'fallback') && frameQueue.length > 0 && !scheduled) {
          schedule();
        }
      }

      function isCanvasBlank() {
        try {
          const img = ctx.getImageData(0, 0, width, height);
          const d = img.data;
          const step = 32;
          for (let y = 0; y < height; y += step) {
            for (let x = 0; x < width; x += step) {
              const i = (y * width + x) * 4;
              // Visible = any non-transparent pixel that is not near-black.
              if (d[i + 3] > 0 && (d[i] + d[i + 1] + d[i + 2]) > 30) return false;
            }
          }
          return true;
        } catch (e) {
          return false; // pixels unreadable (rare); assume the code drew something
        }
      }

      function runFallback(reason) {
        console.log('Falling back to procedural engine (' + reason + ')...');
        phase = 'fallback';
        frameQueue.length = 0; // halt the AI animation loop
        ctx.clearRect(0, 0, width, height);
        // Own scope: declarations can never collide with the AI code's names
        // (a collision would be a parse-time SyntaxError no try/catch can catch).
        (function() {
          
    let n = 0;
    const c = 7;
    const maxPoints = 2500;
    let t = 0;

    function init() {
      ctx.fillStyle = '#040407';
      ctx.fillRect(0, 0, width, height);
      animate();
    }

    function animate() {
      ctx.fillStyle = 'rgba(4, 4, 7, 0.02)';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(width / 2, height / 2);
      ctx.rotate(t * 0.05);

      const goldenAngle = 137.5 * (Math.PI / 180);
      for (let i = 0; i < 60; i++) {
        const idx = (n + i) % maxPoints;
        const a = idx * goldenAngle + t;
        const r = c * Math.sqrt(idx) + Math.sin(idx * 0.1 + t) * 10;
        const x = r * Math.cos(a);
        const y = r * Math.sin(a);

        const color = colors[idx % colors.length];
        ctx.fillStyle = color;
        ctx.beginPath();
        const size = (1 - (r / (width * 0.5))) * 6 + 1;
        ctx.arc(x, y, Math.max(1, size), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      n = (n + 60) % maxPoints;
      t += 0.015;
      requestAnimationFrame(animate);
    }
    
          if (typeof init === 'function') {
            init();
          }
        })();
        if (frameQueue.length > 0 && !scheduled) schedule();
      }

      function decide() {
        if (isCanvasBlank()) {
          runFallback('AI code left the canvas blank');
        } else {
          phase = 'running';
        }
      }

      let customSucceeded = false;
      try {
        // Run the AI code in its own scope so its top-level declarations can
        // never collide with the watchdog's own identifiers.
        (function() {
          const colors = ['#0e1b2b', '#8a2be2', '#f0e6ff', '#b3d3ff', '#ff99aa'];
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
canvas.width = 1024;
canvas.height = 1024;
document.body.appendChild(canvas);

let phi = 0.6180339887; // Golden ratio
let spiralCount = 50;
let points = [];
let wavePhase = 0;
let scale = 1;
let time = 0;

function setup() {
  points = [];
  for (let i = 0; i < spiralCount; i++) {
    let angle = i * 2 * Math.PI / spiralCount;
    let r = i * 10;
    let x = Math.cos(angle) * r;
    let y = Math.sin(angle) * r;
    points.push({x, y, phase: 0, hue: i * 60});
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Apply phyllotaxis spiral matrix
  for (let i = 0; i < points.length; i++) {
    let p = points[i];
    let angle = p.phase * 0.01 + time * 0.001;
    let r = p.phase * 0.02 + 200;
    let x = Math.cos(angle) * r;
    let y = Math.sin(angle) * r;
    p.x = x;
    p.y = y;
    p.phase += 0.0005;
  }
  
  // Render spiral lattice with kaleidoscopic reflection
  for (let i = 0; i < points.length; i++) {
    let p = points[i];
    let hue = (p.hue + time * 0.5) % 360;
    let color = `hsl(${hue}, 80%, 60%)`;
    
    // Reflective pattern
    let reflectX = canvas.width / 2 - p.x;
    let reflectY = canvas.height / 2 - p.y;
    let reflectX2 = canvas.width - reflectX;
    let reflectY2 = canvas.height - reflectY;
    
    // Draw spiral with color gradient
    ctx.beginPath();
    ctx.arc(p.x + canvas.width/2, p.y + canvas.height/2, 1, 0, 2 * Math.PI);
    ctx.fillStyle = color;
    ctx.fill();
    
    // Add subtle glow and neural wave echo
    ctx.beginPath();
    ctx.arc(p.x + 30, p.y + 30, 15, 0, 2 * Math.PI);
    ctx.fillStyle = colors[0];
    ctx.fill();
    ctx.fillStyle = colors[1];
    ctx.shadowColor = colors[2];
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(p.x + 40, p.y + 40, 20, 0, 2 * Math.PI);
    ctx.fill();
    
    // Add kaleidoscopic reflections
    ctx.beginPath();
    ctx.arc(reflectX2 + canvas.width/2, reflectY2 + canvas.height/2, 1, 0, 2 * Math.PI);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = colors[3];
    ctx.stroke();
    
    // Add a neural wave ripple effect
    ctx.beginPath();
    ctx.arc(p.x + 5, p.y + 5, 5, 0, 2 * Math.PI);
    ctx.fillStyle = colors[4];
    ctx.fill();
  }
  
  time += 0.01;
  requestAnimationFrame(draw);
}

setup();
draw();
          if (typeof init === 'function') {
            init();
          }
        })();
        customSucceeded = true;
      } catch (err) {
        console.error('Custom AI art execution error:', err);
      }

      if (!customSucceeded) {
        runFallback('AI code threw an error');
      } else if (frameQueue.length === 0) {
        // No animation requested: judge the synchronous drawing right away.
        if (isCanvasBlank()) runFallback('AI code left the canvas blank');
        else phase = 'running';
      } else if (!nativeRaf) {
        phase = 'running'; // can't probe without rAF; keep whatever ran
      } else {
        schedule(); // animate, then probe the pixels after a few frames
      }
    })();
    

    // Accession caption: derive the display date from this file's timestamp.
    try {
      const m = /([0-9]{8})-([0-9]{6})-([^/]+)[.]html$/.exec(location.pathname);
      if (m) {
        const d = new Date(+m[1].slice(0, 4), +m[1].slice(4, 6) - 1, +m[1].slice(6, 8));
        const el = document.getElementById('artAccession');
        if (el) el.textContent = 'Autonomous Art · ' + d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
      }
    } catch (e) {}
  </script>
</body>
</html>
