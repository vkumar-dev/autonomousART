<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surreal Vision - autonomousART</title>
  <style>
    :root {
      --paper: #f2eee6;
      --ink: #1b1814;
      --ink-soft: #56504a;
      --ink-faint: #938c81;
      --line: rgba(27, 24, 20, 0.14);
      --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
      --sans: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 44px 26px 90px;
    }
    .page { width: 100%; max-width: 780px; }
    .work { width: 100%; }
    .plate {
      position: relative;
      width: 100%;
      background: #0f0f0d;
      line-height: 0;
      box-shadow: 0 1px 2px rgba(27,24,20,0.04), 0 40px 90px -48px rgba(27,24,20,0.5);
    }
    canvas { width: 100%; height: auto; display: block; }
    .caption { padding-top: 26px; }
    .kicker {
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 16px;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(25px, 5vw, 36px);
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
    }
    .desc {
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink-soft);
      max-width: 62ch;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 26px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .palette { display: inline-flex; gap: 7px; align-items: center; }
    .palette i {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(27,24,20,0.16);
    }
    .back {
      display: inline-block;
      margin-top: 40px;
      font-size: 10.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink);
      border-bottom: 1px solid var(--line);
      padding-bottom: 4px;
      transition: border-color 0.4s ease;
    }
    .back:hover { border-color: var(--ink); }

    /* #stage: frame-only mode used when the piece is embedded (thumbnails, viewing room) */
    html.stage body { padding: 0; display: block; }
    html.stage .page {
      width: 100%;
      max-width: none;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    html.stage .work { width: min(100vw, 100vh); }
    html.stage .plate { width: 100%; box-shadow: none; }
    html.stage .caption,
    html.stage .back { display: none; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
  <script>
    if (location.hash === '#stage') document.documentElement.classList.add('stage');
  </script>
</head>
<body>
  <div class="page">
    <figure class="work">
      <div class="plate">
        <canvas id="artCanvas" width="1024" height="1024"></canvas>
      </div>
      <figcaption class="caption">
        <p class="kicker" id="artAccession">Autonomous Art &middot; Generative</p>
        <h1>Surreal Vision</h1>
        <p class="desc">A generative digital abstraction with algorithmic depth and morphing structures.</p>
        <div class="meta-row">
          <span>Particle Singularity Vortex</span>
          <span>Animated</span>
          <span class="palette"><i style="background:#1a1a2e"></i><i style="background:#16213e"></i><i style="background:#0f3460"></i><i style="background:#e94560"></i><i style="background:#53354a"></i></span>
        </div>
      </figcaption>
    </figure>
    <a class="back" href="../../../../index.html">&larr; Return to collection</a>
  </div>

  <script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const colors = ["#1a1a2e","#16213e","#0f3460","#e94560","#53354a"];
    const technique = 'particle singularity vortex';

    // Allow AI models querying document.getElementById('canvas') or 'artCanvas' to succeed
    const _origGetElementById = document.getElementById.bind(document);
    document.getElementById = function(id) {
      if (id === 'canvas' || id === 'artCanvas') return canvas;
      return _origGetElementById(id);
    };

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    
    // --- AI-GENERATED CANVAS CODE (watchdog-guarded) ---
    (function() {
      // The AI writes arbitrary code, so before trusting its output we probe the
      // real canvas pixels. If the code throws OR leaves the canvas effectively
      // blank after a few animation frames, we stop its loop and run the proven
      // procedural engine instead. This prevents silently-deployed black pages.
      const nativeRaf = (typeof window !== 'undefined' && window.requestAnimationFrame)
        ? window.requestAnimationFrame.bind(window)
        : null;

      const frameQueue = [];
      let scheduled = false;
      let phase = 'probing';   // 'probing' -> 'running' (AI kept) | 'fallback'
      let probeFrames = 0;
      let frameTime = 0;
      const PROBE_FRAMES = 12;

      function schedule() {
        if (scheduled || !nativeRaf) return;
        scheduled = true;
        nativeRaf(flush);
      }

      // Intercept rAF so we can count frames for the probe and, when needed,
      // fully stop the AI animation before the fallback engine starts.
      window.requestAnimationFrame = function(cb) {
        frameQueue.push(cb);
        schedule();
        return 0;
      };
      window.cancelAnimationFrame = function() {};

      function flush() {
        scheduled = false;
        frameTime += 16;
        const cbs = frameQueue.splice(0, frameQueue.length);
        for (let i = 0; i < cbs.length; i++) {
          try { cbs[i](frameTime); } catch (e) { console.error('Animation frame error:', e); }
        }
        if (phase === 'probing') {
          probeFrames++;
          if (probeFrames >= PROBE_FRAMES) decide();
        }
        if (phase === 'probing') {
          if (!scheduled) schedule();
        } else if ((phase === 'running' || phase === 'fallback') && frameQueue.length > 0 && !scheduled) {
          schedule();
        }
      }

      function isCanvasBlank() {
        try {
          const img = ctx.getImageData(0, 0, width, height);
          const d = img.data;
          const step = 32;
          for (let y = 0; y < height; y += step) {
            for (let x = 0; x < width; x += step) {
              const i = (y * width + x) * 4;
              // Visible = any non-transparent pixel that is not near-black.
              if (d[i + 3] > 0 && (d[i] + d[i + 1] + d[i + 2]) > 30) return false;
            }
          }
          return true;
        } catch (e) {
          return false; // pixels unreadable (rare); assume the code drew something
        }
      }

      function runFallback(reason) {
        console.log('Falling back to procedural engine (' + reason + ')...');
        phase = 'fallback';
        frameQueue.length = 0; // halt the AI animation loop
        ctx.clearRect(0, 0, width, height);
        // Own scope: declarations can never collide with the AI code's names
        // (a collision would be a parse-time SyntaxError no try/catch can catch).
        (function() {
          
    const count = 400;
    const bodies = [];
    let angle = 0;

    class Body {
      constructor() {
        this.reset();
      }
      reset() {
        this.dist = random(40, width * 0.45);
        this.angle = random(0, Math.PI * 2);
        this.speed = (width * 0.15) / (this.dist + 20);
        this.size = random(1.5, 4.5);
        this.color = randomChoice(colors);
      }
      update() {
        this.angle += this.speed * 0.03;
        this.dist -= 0.15;
        if (this.dist < 20) this.reset();
      }
      draw() {
        const x = width / 2 + Math.cos(this.angle) * this.dist;
        const y = height / 2 + Math.sin(this.angle) * this.dist;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(x, y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function init() {
      ctx.fillStyle = '#06060c';
      ctx.fillRect(0, 0, width, height);
      for (let i = 0; i < count; i++) bodies.push(new Body());
      animate();
    }

    function animate() {
      ctx.fillStyle = 'rgba(6, 6, 12, 0.06)';
      ctx.fillRect(0, 0, width, height);

      bodies.forEach(b => { b.update(); b.draw(); });

      // Core singularity glow
      const grad = ctx.createRadialGradient(width/2, height/2, 5, width/2, height/2, 90);
      grad.addColorStop(0, colors[0]);
      grad.addColorStop(0.5, colors[1] || '#ffffff');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(width/2, height/2, 90, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(animate);
    }
    
          if (typeof init === 'function') {
            init();
          }
        })();
        if (frameQueue.length > 0 && !scheduled) schedule();
      }

      function decide() {
        if (isCanvasBlank()) {
          runFallback('AI code left the canvas blank');
        } else {
          phase = 'running';
        }
      }

      let customSucceeded = false;
      try {
        // Run the AI code in its own scope so its top-level declarations can
        // never collide with the watchdog's own identifiers.
        (function() {
          // Particle Singularity Vortex
// HTML5 Canvas animation
// Full scope: canvas, ctx, width, height, colors, random, randomChoice
// Animation speed: smooth (requestAnimationFrame)
// Animation time: infinite
// Layer structure: 4 layers (particles, vortex, mirror, light ring)

const canvas = document.createElement('canvas');
canvas.width = width;
canvas.height = height;
ctx = canvas.getContext('2d');

let particles = [];
const particleCount = 10000;

// Particle creation
function createParticle() {
    const x = random(width);
    const y = random(height);
    const size = random(1, 10);
    const speed = random(0.01, 0.2);
    const color = randomChoice([
        '#FFF9E6',
        '#FEF2E8',
        '#EED4C9',
        '#D9E8B3',
        '#C4D8A4',
        '#C7E0F9',
        '#B0D7F5',
        '#A3C8F8',
        '#96C7F9',
        '#89C4F3',
        '#82B6F1',
        '#74A4EC'
    ]);
    const rotation = random(0, 2 * Math.PI);
    particles.push({
        x: x,
        y: y,
        size: size,
        speed: speed,
        color: color,
        rotation: rotation,
        trail: []
    });
}

// Particle logic
particles.forEach(particle => {
    // Move particle forward
    particle.x += particle.speed;
    particle.y += particle.speed * 0.5;
    particle.rotation += 0.1;
    
    // Trail
    if (particle.trail.length > 100) {
        particle.trail.shift();
    }
    particle.trail.push(particle.x);
    
    // Bounce off edges
    if (particle.x > width) particle.x = 0;
    if (particle.x < 0) particle.x = width;
    if (particle.y > height) particle.y = 0;
    if (particle.y < 0) particle.y = height;
    
    // Gravity
    particle.y += particle.speed * 0.02;
    
    // Size
    particle.size += 0.01;
    if (particle.size > 10) particle.size = 1;
    
    // Color drift
    const hue = (particle.trail.length + particle.rotation * 10) % 360;
    particle.color = `#${hue.toString(16)}`;
});

// Particle animation
function animate() {
    ctx.clearRect(0, 0, width, height);
    
    // Vortex layer
    ctx.save();
    ctx.beginPath();
    ctx.arc(width/2, height/2, width/2 * 0.85, 0, 2 * Math.PI);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.fill();
    ctx.restore();
    
    // Mirror layer
    for (let i = 0; i < particles.length; i++) {
        const particle = particles[i];
        ctx.fillStyle = particle.color;
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.size, 0, 2 * Math.PI);
        ctx.fill();
        
        // Trail
        ctx.lineWidth = 0.5;
        ctx.strokeStyle = particle.color;
        ctx.beginPath();
        ctx.moveTo(particle.x - 5, particle.y);
        for (let j = 1; j < particle.trail.length; j++) {
            const prev = particle.trail[j-1];
            const current = particle.trail[j];
            ctx.lineTo(prev, particle.y);
        }
        ctx.stroke();
        
        // Particle shadow
        const shadow = particle.size * 0.5;
        const shadowX = particle.x + shadow * Math.cos(particle.rotation);
        const shadowY = particle.y + shadow * Math.sin(particle.rotation);
        ctx.beginPath();
        ctx.arc(shadowX, shadowY, shadow * 0.8, 0, 2 * Math.PI);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fill();
    }
    
    // Light ring
    const radius = width/2 - 30;
    const lightRings = 10;
    for (let i = 0; i < lightRings; i++) {
        const angle = (2 * Math.PI * i) / lightRings;
        const x = radius * Math.cos(angle);
        const y = radius * Math.sin(angle);
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, 2 * Math.PI);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fill();
    }
    
    // Draw particles
    for (let i = 0; i < particles.length; i++) {
        const particle = particles[i];
        
        // Draw particle shape
        ctx.save();
        ctx.translate(particle.x, particle.y);
        ctx.rotate(particle.rotation);
        ctx.beginPath();
        ctx.moveTo(0, particle.size);
        ctx.lineTo(particle.size * 0.5, -particle.size);
        ctx.lineTo(particle.size, particle.size * 0.5);
        ctx.closePath();
        ctx.fillStyle = particle.color;
        ctx.fill();
        ctx.restore();
    }
    
    // Mirror reflection
    const mirrorX = width/2;
    const mirrorY = height/2;
    const mirrorSize = 80;
    const mirrorOffsetX = (particles.length % 2 ? -1 : 1) * mirrorSize;
    const mirrorOffsetY = (particles.length % 2 ? -1 : 1) * mirrorSize;
    
    ctx.beginPath();
    ctx.arc(mirrorX + mirrorOffsetX, mirrorY + mirrorOffsetY, mirrorSize, 0, 2 * Math.PI);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.fill();
    
    // Draw text
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('The Echo of Light', width/2, height/2 - 10);
    
    // Frame number
    const frameNum = Math.floor(performance.now() / 1000);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Arial';
    ctx.fillText(`Frame ${frameNum}`, 5, 20);
    
    // Clear the canvas
    ctx.restore();
    
    requestAnimationFrame(animate);
}

animate();
          if (typeof init === 'function') {
            init();
          }
        })();
        customSucceeded = true;
      } catch (err) {
        console.error('Custom AI art execution error:', err);
      }

      if (!customSucceeded) {
        runFallback('AI code threw an error');
      } else if (frameQueue.length === 0) {
        // No animation requested: judge the synchronous drawing right away.
        if (isCanvasBlank()) runFallback('AI code left the canvas blank');
        else phase = 'running';
      } else if (!nativeRaf) {
        phase = 'running'; // can't probe without rAF; keep whatever ran
      } else {
        schedule(); // animate, then probe the pixels after a few frames
      }
    })();
    

    // Accession caption: derive the display date from this file's timestamp.
    try {
      const m = /([0-9]{8})-([0-9]{6})-([^/]+)[.]html$/.exec(location.pathname);
      if (m) {
        const d = new Date(+m[1].slice(0, 4), +m[1].slice(4, 6) - 1, +m[1].slice(6, 8));
        const el = document.getElementById('artAccession');
        if (el) el.textContent = 'Autonomous Art · ' + d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
      }
    } catch (e) {}
  </script>
</body>
</html>
