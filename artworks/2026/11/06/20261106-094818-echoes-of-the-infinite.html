<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echoes of the Infinite - autonomousART</title>
  <style>
    :root {
      --paper: #f2eee6;
      --ink: #1b1814;
      --ink-soft: #56504a;
      --ink-faint: #938c81;
      --line: rgba(27, 24, 20, 0.14);
      --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
      --sans: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 44px 26px 90px;
    }
    .page { width: 100%; max-width: 780px; }
    .work { width: 100%; }
    .plate {
      position: relative;
      width: 100%;
      background: #0f0f0d;
      line-height: 0;
      box-shadow: 0 1px 2px rgba(27,24,20,0.04), 0 40px 90px -48px rgba(27,24,20,0.5);
    }
    canvas { width: 100%; height: auto; display: block; }
    .caption { padding-top: 26px; }
    .kicker {
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 16px;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(25px, 5vw, 36px);
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
    }
    .desc {
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink-soft);
      max-width: 62ch;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 26px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .palette { display: inline-flex; gap: 7px; align-items: center; }
    .palette i {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(27,24,20,0.16);
    }
    .back {
      display: inline-block;
      margin-top: 40px;
      font-size: 10.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink);
      border-bottom: 1px solid var(--line);
      padding-bottom: 4px;
      transition: border-color 0.4s ease;
    }
    .back:hover { border-color: var(--ink); }

    /* #stage: frame-only mode used when the piece is embedded (thumbnails, viewing room) */
    html.stage body { padding: 0; display: block; }
    html.stage .page {
      width: 100%;
      max-width: none;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    html.stage .work { width: min(100vw, 100vh); }
    html.stage .plate { width: 100%; box-shadow: none; }
    html.stage .caption,
    html.stage .back { display: none; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
  <script>
    if (location.hash === '#stage') document.documentElement.classList.add('stage');
  </script>
</head>
<body>
  <div class="page">
    <figure class="work">
      <div class="plate">
        <canvas id="artCanvas" width="1024" height="1024"></canvas>
      </div>
      <figcaption class="caption">
        <p class="kicker" id="artAccession">Autonomous Art &middot; Generative</p>
        <h1>Echoes of the Infinite</h1>
        <p class="desc">A hyperbolic kaleidoscope unfolds like a cosmic membrane, each reflection distorting into a fractal hymn of recursive symmetry. The pattern evolves with time, as if the universe is singing itself into being through infinite self-reflection.</p>
        <div class="meta-row">
          <span>Hyperbolic Kaleidoscope</span>
          <span>Animated</span>
          <span class="palette"><i style="background:#001f3f"></i><i style="background:#0077cc"></i><i style="background:#ff6600"></i><i style="background:#8a2be2"></i><i style="background:#00ff77"></i></span>
        </div>
      </figcaption>
    </figure>
    <a class="back" href="../../../../index.html">&larr; Return to collection</a>
  </div>

  <script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const colors = ["#001f3f","#0077cc","#ff6600","#8a2be2","#00ff77"];
    const technique = 'hyperbolic kaleidoscope';

    // Allow AI models querying document.getElementById('canvas') or 'artCanvas' to succeed
    const _origGetElementById = document.getElementById.bind(document);
    document.getElementById = function(id) {
      if (id === 'canvas' || id === 'artCanvas') return canvas;
      return _origGetElementById(id);
    };

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    
    // --- AI-GENERATED CANVAS CODE (watchdog-guarded) ---
    (function() {
      // The AI writes arbitrary code, so before trusting its output we probe the
      // real canvas pixels. If the code throws OR leaves the canvas effectively
      // blank after a few animation frames, we stop its loop and run the proven
      // procedural engine instead. This prevents silently-deployed black pages.
      const nativeRaf = (typeof window !== 'undefined' && window.requestAnimationFrame)
        ? window.requestAnimationFrame.bind(window)
        : null;

      const frameQueue = [];
      let scheduled = false;
      let phase = 'probing';   // 'probing' -> 'running' (AI kept) | 'fallback'
      let probeFrames = 0;
      let frameTime = 0;
      const PROBE_FRAMES = 12;

      function schedule() {
        if (scheduled || !nativeRaf) return;
        scheduled = true;
        nativeRaf(flush);
      }

      // Intercept rAF so we can count frames for the probe and, when needed,
      // fully stop the AI animation before the fallback engine starts.
      window.requestAnimationFrame = function(cb) {
        frameQueue.push(cb);
        schedule();
        return 0;
      };
      window.cancelAnimationFrame = function() {};

      function flush() {
        scheduled = false;
        frameTime += 16;
        const cbs = frameQueue.splice(0, frameQueue.length);
        for (let i = 0; i < cbs.length; i++) {
          try { cbs[i](frameTime); } catch (e) { console.error('Animation frame error:', e); }
        }
        if (phase === 'probing') {
          probeFrames++;
          if (probeFrames >= PROBE_FRAMES) decide();
        }
        if (phase === 'probing') {
          if (!scheduled) schedule();
        } else if ((phase === 'running' || phase === 'fallback') && frameQueue.length > 0 && !scheduled) {
          schedule();
        }
      }

      function isCanvasBlank() {
        try {
          const img = ctx.getImageData(0, 0, width, height);
          const d = img.data;
          const step = 32;
          for (let y = 0; y < height; y += step) {
            for (let x = 0; x < width; x += step) {
              const i = (y * width + x) * 4;
              // Visible = any non-transparent pixel that is not near-black.
              if (d[i + 3] > 0 && (d[i] + d[i + 1] + d[i + 2]) > 30) return false;
            }
          }
          return true;
        } catch (e) {
          return false; // pixels unreadable (rare); assume the code drew something
        }
      }

      function runFallback(reason) {
        console.log('Falling back to procedural engine (' + reason + ')...');
        phase = 'fallback';
        frameQueue.length = 0; // halt the AI animation loop
        ctx.clearRect(0, 0, width, height);
        // Own scope: declarations can never collide with the AI code's names
        // (a collision would be a parse-time SyntaxError no try/catch can catch).
        (function() {
          
    let t = 0;
    const folds = Math.floor(random(6, 12));

    function init() {
      animate();
    }

    function animate() {
      ctx.fillStyle = 'rgba(5, 5, 8, 0.08)';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(width / 2, height / 2);

      const angleStep = (Math.PI * 2) / folds;
      for (let fold = 0; fold < folds; fold++) {
        ctx.save();
        ctx.rotate(fold * angleStep + t * 0.01);
        if (fold % 2 === 1) ctx.scale(1, -1);

        for (let r = 50; r < 400; r += 40) {
          const wave = Math.sin(r * 0.03 + t) * 35;
          const color = colors[Math.floor(r * 0.1) % colors.length];

          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(r, wave, 20 + Math.cos(t + r) * 10, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = color;
          ctx.globalAlpha = 0.5;
          ctx.fillRect(r + wave, wave, 6, 6);
        }
        ctx.restore();
      }
      ctx.restore();

      t += 0.02;
      requestAnimationFrame(animate);
    }
    
          if (typeof init === 'function') {
            init();
          }
        })();
        if (frameQueue.length > 0 && !scheduled) schedule();
      }

      function decide() {
        if (isCanvasBlank()) {
          runFallback('AI code left the canvas blank');
        } else {
          phase = 'running';
        }
      }

      let customSucceeded = false;
      try {
        // Run the AI code in its own scope so its top-level declarations can
        // never collide with the watchdog's own identifiers.
        (function() {
          // Complete creative HTML5 canvas animation or generative drawing.
// Available in scope: canvas, ctx, width (1024), height (1024), colors (array of 5 hex strings), random(min, max), randomChoice(arr).
// Use requestAnimationFrame for smooth animation, or generate an intricate multi-layered composition.
// Start your animation or drawing immediately.

const canvas = document.createElement('canvas');
canvas.width = 1024;
canvas.height = 1024;
document.body.appendChild(canvas);
const ctx = canvas.getContext('2d');

const colors = ['#001f3f', '#0077cc', '#ff6600', '#8a2be2', '#00ff77'];
const center = { x: 512, y: 512 };
const maxIterations = 20;
const numReflections = 12;
const baseRadius = 100;
const growthRate = 0.003;

let time = 0;

function drawHyperbolicKaleidoscope() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'black';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  const scale = 1 + Math.sin(time * 0.001) * 0.1;

  for (let i = 0; i < 360; i++) {
    const angle = (i / 360) * Math.PI * 2;
    const offset = time * 0.01 + i * 0.001;
    const radius = baseRadius + Math.sin(offset) * 150;
    
    // Hyperbolic spiral path
    const spiralPoints = [];
    for (let j = 0; j < 100; j++) {
      const t = j / 100;
      const r = radius * (1 + t * 0.5) * (1 + Math.sin(t * 3 + offset) * 0.3);
      const x = centerX + r * Math.cos(angle + t * 0.1);
      const y = centerY + r * Math.sin(angle + t * 0.1);
      spiralPoints.push({ x, y });
    }

    // Reflect and distort the spiral across hyperbolic planes
    const reflections = [];
    for (let k = 0; k < numReflections; k++) {
      const reflectionAngle = (angle + k * (Math.PI / numReflections)) % (2 * Math.PI);
      const distortion = random(-0.1, 0.1);
      const strength = 1 - (k / numReflections) * 0.8;
      
      for (let point of spiralPoints) {
        const dx = point.x - centerX;
        const dy = point.y - centerY;
        const newAngle = Math.atan2(dy, dx);
        const newR = Math.sqrt(dx*dx + dy*dy);
        
        // Hyperbolic reflection: x' = x cos θ + y sin θ, y' = -x sin θ + y cos θ
        const r1 = newR * (1 + 0.1 * Math.sin(time * 0.002 + k * 0.1));
        const x1 = centerX + r1 * Math.cos(newAngle + distortion);
        const y1 = centerY + r1 * Math.sin(newAngle + distortion);
        
        reflections.push({ x: x1, y: y1, angle: reflectionAngle, strength });
      }
    }

    // Draw each reflection with shifting color gradients
    for (let j = 0; j < reflections.length; j++) {
      const p = reflections[j];
      const hue = (i + time * 0.01) % 360;
      const colorIndex = (i + j) % colors.length;
      const c = colors[colorIndex];
      const alpha = 0.8 - (j / reflections.length) * 0.3;
      
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = c;
      ctx.lineWidth = 1 + (Math.sin(time + p.angle) * 2);
      ctx.beginPath();
      ctx.moveTo(center.x, center.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.restore();
    }
  }

  // Draw pulsing central vortex
  const pulse = 100 + Math.sin(time * 0.005) * 50;
  ctx.beginPath();
  ctx.arc(center.x, center.y, pulse, 0, Math.PI * 2);
  ctx.strokeStyle = '#00ff77';
  ctx.lineWidth = 3;
  ctx.globalCompositeOperation = 'lighter';
  ctx.stroke();

  // Add faint glowing points along hyperbolic paths
  for (let i = 0; i < 10; i++) {
    const x = centerX + 100 * Math.cos(time * 0.01 + i) * (1 + Math.sin(time) * 0.3);
    const y = centerY + 100 * Math.sin(time * 0.01 + i) * (1 + Math.cos(time) * 0.3);
    ctx.fillStyle = colors[randomChoice([0,1,2])];
    ctx.beginPath();
    ctx.arc(x, y, 2 + Math.sin(time + i) * 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  time += 0.016;
  requestAnimationFrame(drawHyperbolicKaleidoscope);
}

// Initialize and start
drawHyperbolicKaleidoscope();
          if (typeof init === 'function') {
            init();
          }
        })();
        customSucceeded = true;
      } catch (err) {
        console.error('Custom AI art execution error:', err);
      }

      if (!customSucceeded) {
        runFallback('AI code threw an error');
      } else if (frameQueue.length === 0) {
        // No animation requested: judge the synchronous drawing right away.
        if (isCanvasBlank()) runFallback('AI code left the canvas blank');
        else phase = 'running';
      } else if (!nativeRaf) {
        phase = 'running'; // can't probe without rAF; keep whatever ran
      } else {
        schedule(); // animate, then probe the pixels after a few frames
      }
    })();
    

    // Accession caption: derive the display date from this file's timestamp.
    try {
      const m = /([0-9]{8})-([0-9]{6})-([^/]+)[.]html$/.exec(location.pathname);
      if (m) {
        const d = new Date(+m[1].slice(0, 4), +m[1].slice(4, 6) - 1, +m[1].slice(6, 8));
        const el = document.getElementById('artAccession');
        if (el) el.textContent = 'Autonomous Art · ' + d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
      }
    } catch (e) {}
  </script>
</body>
</html>
