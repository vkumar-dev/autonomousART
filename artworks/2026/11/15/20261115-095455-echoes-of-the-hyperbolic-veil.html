<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echoes of the Hyperbolic Veil - autonomousART</title>
  <style>
    :root {
      --paper: #f2eee6;
      --ink: #1b1814;
      --ink-soft: #56504a;
      --ink-faint: #938c81;
      --line: rgba(27, 24, 20, 0.14);
      --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
      --sans: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 44px 26px 90px;
    }
    .page { width: 100%; max-width: 780px; }
    .work { width: 100%; }
    .plate {
      position: relative;
      width: 100%;
      background: #0f0f0d;
      line-height: 0;
      box-shadow: 0 1px 2px rgba(27,24,20,0.04), 0 40px 90px -48px rgba(27,24,20,0.5);
    }
    canvas { width: 100%; height: auto; display: block; }
    .caption { padding-top: 26px; }
    .kicker {
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 16px;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(25px, 5vw, 36px);
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
    }
    .desc {
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink-soft);
      max-width: 62ch;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 26px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .palette { display: inline-flex; gap: 7px; align-items: center; }
    .palette i {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(27,24,20,0.16);
    }
    .back {
      display: inline-block;
      margin-top: 40px;
      font-size: 10.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink);
      border-bottom: 1px solid var(--line);
      padding-bottom: 4px;
      transition: border-color 0.4s ease;
    }
    .back:hover { border-color: var(--ink); }

    /* #stage: frame-only mode used when the piece is embedded (thumbnails, viewing room) */
    html.stage body { padding: 0; display: block; }
    html.stage .page {
      width: 100%;
      max-width: none;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    html.stage .work { width: min(100vw, 100vh); }
    html.stage .plate { width: 100%; box-shadow: none; }
    html.stage .caption,
    html.stage .back { display: none; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
  <script>
    if (location.hash === '#stage') document.documentElement.classList.add('stage');
  </script>
</head>
<body>
  <div class="page">
    <figure class="work">
      <div class="plate">
        <canvas id="artCanvas" width="1024" height="1024"></canvas>
      </div>
      <figcaption class="caption">
        <p class="kicker" id="artAccession">Autonomous Art &middot; Generative</p>
        <h1>Echoes of the Hyperbolic Veil</h1>
        <p class="desc">A flowing, recursive lattice of hyperbolic spirals unfolds from a central singularity, each iteration reflecting a subtle phase shift in wavefronts—mathematically driven by Poincaré disk mappings and hyperbolic cosine growth. The structure evolves like a living membrane, pulsing with gradient-shifte</p>
        <div class="meta-row">
          <span>Fractal Flame Dynamics</span>
          <span>Animated</span>
          <span class="palette"><i style="background:#0a0a4d"></i><i style="background:#2b3a7c"></i><i style="background:#665a9e"></i><i style="background:#f0d9b5"></i><i style="background:#ff8c8c"></i></span>
        </div>
      </figcaption>
    </figure>
    <a class="back" href="../../../../index.html">&larr; Return to collection</a>
  </div>

  <script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const colors = ["#0a0a4d","#2b3a7c","#665a9e","#f0d9b5","#ff8c8c"];
    const technique = 'fractal flame dynamics';

    // Allow AI models querying document.getElementById('canvas') or 'artCanvas' to succeed
    const _origGetElementById = document.getElementById.bind(document);
    document.getElementById = function(id) {
      if (id === 'canvas' || id === 'artCanvas') return canvas;
      return _origGetElementById(id);
    };

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    
    // --- AI-GENERATED CANVAS CODE (watchdog-guarded) ---
    (function() {
      // The AI writes arbitrary code, so before trusting its output we probe the
      // real canvas pixels. If the code throws OR leaves the canvas effectively
      // blank after a few animation frames, we stop its loop and run the proven
      // procedural engine instead. This prevents silently-deployed black pages.
      const nativeRaf = (typeof window !== 'undefined' && window.requestAnimationFrame)
        ? window.requestAnimationFrame.bind(window)
        : null;

      const frameQueue = [];
      let scheduled = false;
      let phase = 'probing';   // 'probing' -> 'running' (AI kept) | 'fallback'
      let probeFrames = 0;
      let frameTime = 0;
      const PROBE_FRAMES = 12;

      function schedule() {
        if (scheduled || !nativeRaf) return;
        scheduled = true;
        nativeRaf(flush);
      }

      // Intercept rAF so we can count frames for the probe and, when needed,
      // fully stop the AI animation before the fallback engine starts.
      window.requestAnimationFrame = function(cb) {
        frameQueue.push(cb);
        schedule();
        return 0;
      };
      window.cancelAnimationFrame = function() {};

      function flush() {
        scheduled = false;
        frameTime += 16;
        const cbs = frameQueue.splice(0, frameQueue.length);
        for (let i = 0; i < cbs.length; i++) {
          try { cbs[i](frameTime); } catch (e) { console.error('Animation frame error:', e); }
        }
        if (phase === 'probing') {
          probeFrames++;
          if (probeFrames >= PROBE_FRAMES) decide();
        }
        if (phase === 'probing') {
          if (!scheduled) schedule();
        } else if ((phase === 'running' || phase === 'fallback') && frameQueue.length > 0 && !scheduled) {
          schedule();
        }
      }

      function isCanvasBlank() {
        try {
          const img = ctx.getImageData(0, 0, width, height);
          const d = img.data;
          const step = 32;
          for (let y = 0; y < height; y += step) {
            for (let x = 0; x < width; x += step) {
              const i = (y * width + x) * 4;
              // Visible = any non-transparent pixel that is not near-black.
              if (d[i + 3] > 0 && (d[i] + d[i + 1] + d[i + 2]) > 30) return false;
            }
          }
          return true;
        } catch (e) {
          return false; // pixels unreadable (rare); assume the code drew something
        }
      }

      function runFallback(reason) {
        console.log('Falling back to procedural engine (' + reason + ')...');
        phase = 'fallback';
        frameQueue.length = 0; // halt the AI animation loop
        ctx.clearRect(0, 0, width, height);
        // Own scope: declarations can never collide with the AI code's names
        // (a collision would be a parse-time SyntaxError no try/catch can catch).
        (function() {
          
    let frame = 0;

    function init() {
      animate();
    }

    function animate() {
      ctx.fillStyle = 'rgba(5, 5, 8, 0.08)';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(width / 2, height / 2);

      const branches = 6;
      const angle = (Math.PI * 2) / branches;

      function drawBranch(len, depth, maxDepth) {
        if (depth > maxDepth) return;
        const color = colors[depth % colors.length];
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(1, (maxDepth - depth) * 1.5);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -len);
        ctx.stroke();

        ctx.save();
        ctx.translate(0, -len);

        const sway = Math.sin(frame * 0.02 + depth) * 0.4;
        ctx.save();
        ctx.rotate(0.5 + sway);
        drawBranch(len * 0.72, depth + 1, maxDepth);
        ctx.restore();

        ctx.save();
        ctx.rotate(-0.5 + sway);
        drawBranch(len * 0.72, depth + 1, maxDepth);
        ctx.restore();

        ctx.restore();
      }

      for (let i = 0; i < branches; i++) {
        ctx.save();
        ctx.rotate(i * angle + frame * 0.005);
        drawBranch(120, 0, 6);
        ctx.restore();
      }

      ctx.restore();
      frame++;
      requestAnimationFrame(animate);
    }
    
          if (typeof init === 'function') {
            init();
          }
        })();
        if (frameQueue.length > 0 && !scheduled) schedule();
      }

      function decide() {
        if (isCanvasBlank()) {
          runFallback('AI code left the canvas blank');
        } else {
          phase = 'running';
        }
      }

      let customSucceeded = false;
      try {
        // Run the AI code in its own scope so its top-level declarations can
        // never collide with the watchdog's own identifiers.
        (function() {
          // Complete creative HTML5 canvas animation or generative drawing.
// Available in scope: canvas, ctx, width (1024), height (10-24), colors (array of 5 hex strings), random(min, max), randomChoice(arr).
// Use requestAnimationFrame for smooth animation, or generate an intricate multi-layered composition.
// Start your animation or drawing immediately.

const canvas = document.createElement('canvas');
canvas.width = 1024;
canvas.height = 1024;
document.body.appendChild(canvas);
const ctx = canvas.getContext('2d');

const colors = ['#0a0a4d', '#2b3a7c', '#665a9e', '#f0d9b5', '#ff8c8c'];
const iterations = 15;
const maxDepth = 8;
const radiusFactor = 0.8;
const waveSpeed = 0.008;
const phaseOffset = 0.01;

let xCenter = canvas.width / 2;
let yCenter = canvas.height / 2;

function normalizeAngle(angle) {
  return (angle % (2 * Math.PI)) / (2 * Math.PI);
}

function hyperbolicSpiral(r, theta) {
  return 1 / (Math.cosh(theta) * 0.5) * 100;
}

function mapToHyperbolic(r, theta) {
  const rMapped = Math.log(r) * 0.5 + 10;
  return {
    x: xCenter + rMapped * Math.cos(theta),
    y: yCenter + rMapped * Math.sin(theta)
  };
}

function generateFractalPoint(theta, depth) {
  if (depth === 0) return { x: xCenter, y: yCenter };

  let r = 1.0;
  const baseTheta = theta + depth * phaseOffset;
  const thetaStep = 0.1 * (depth * 0.1 + 0.05);
  
  let spiralR = hyperbolicSpiral(r, baseTheta);
  let spiralX = xCenter + spiralR * Math.cos(baseTheta);
  let spiralY = yCenter + spiralR * Math.sin(baseTheta);

  const r2 = spiralR * radiusFactor;
  const theta2 = baseTheta + thetaStep;

  return {
    x: xCenter + r2 * Math.cos(theta2),
    y: yCenter + r2 * Math.sin(theta2)
  };
}

function interpolateColor(a, b, t) {
  return {
    r: Math.floor(a.r + (b.r - a.r) * t),
    g: Math.floor(a.g + (b.g - a.g) * t),
    b: Math.floor(a.b + (b.b - a.b) * t)
  };
}

function getGradientColor(d, depth) {
  const baseColor = colors[Math.floor(d % 5)];
  const intensity = (depth % 5) / 4.0;
  const color = {
    r: parseInt(baseColor.slice(1,3), 16),
    g: parseInt(baseColor.slice(3,5), 16),
    b: parseInt(baseColor.slice(5,7), 16)
  };
  const blended = interpolateColor(
    { r: 0, g: 0, b: 0 },
    { r: color.r, g: color.g, b: color.b },
    intensity
  );
  return `rgb(${blended.r}, ${blended.g}, ${blended.b})`;
}

let time = 0;
let activeSpirals = [];

function drawHyperbolicVeil() {
  ctx.fillStyle = 'rgba(10,10,77,0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(xCenter, yCenter);

  const thetaStep = 0.02;
  const maxTheta = 2 * Math.PI;
  let theta = 0;

  while (theta < maxTheta) {
    const depth = Math.floor((theta / (maxTheta / 10)) % maxDepth);
    const spiralPoints = [];

    for (let i = 0; i < iterations; i++) {
      const point = generateFractalPoint(theta + i * thetaStep, depth);
      spiralPoints.push(point);
    }

    // Draw spiral as a dynamic wave
    const waveAlpha = 0.4 + 0.3 * Math.sin(time * waveSpeed + theta);
    const waveColor = getGradientColor(theta * 100, depth);

    ctx.strokeStyle = waveColor;
    ctx.lineWidth = 0.8 + (depth * 0.2);
    ctx.beginPath();

    spiralPoints.forEach((p, idx) => {
      if (idx === 0) {
        ctx.moveTo(p.x, p.y);
      } else {
        ctx.lineTo(p.x, p.y);
      }
    });

    ctx.stroke();

    theta += thetaStep;
  }

  ctx.restore();
  time += 0.05;
  requestAnimationFrame(drawHyperbolicVeil);
}

drawHyperbolicVeil();
          if (typeof init === 'function') {
            init();
          }
        })();
        customSucceeded = true;
      } catch (err) {
        console.error('Custom AI art execution error:', err);
      }

      if (!customSucceeded) {
        runFallback('AI code threw an error');
      } else if (frameQueue.length === 0) {
        // No animation requested: judge the synchronous drawing right away.
        if (isCanvasBlank()) runFallback('AI code left the canvas blank');
        else phase = 'running';
      } else if (!nativeRaf) {
        phase = 'running'; // can't probe without rAF; keep whatever ran
      } else {
        schedule(); // animate, then probe the pixels after a few frames
      }
    })();
    

    // Accession caption: derive the display date from this file's timestamp.
    try {
      const m = /([0-9]{8})-([0-9]{6})-([^/]+)[.]html$/.exec(location.pathname);
      if (m) {
        const d = new Date(+m[1].slice(0, 4), +m[1].slice(4, 6) - 1, +m[1].slice(6, 8));
        const el = document.getElementById('artAccession');
        if (el) el.textContent = 'Autonomous Art · ' + d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
      }
    } catch (e) {}
  </script>
</body>
</html>
