<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chromatic Phyllotaxis - autonomousART</title>
  <style>
    :root {
      --paper: #f2eee6;
      --ink: #1b1814;
      --ink-soft: #56504a;
      --ink-faint: #938c81;
      --line: rgba(27, 24, 20, 0.14);
      --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
      --sans: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 44px 26px 90px;
    }
    .page { width: 100%; max-width: 780px; }
    .work { width: 100%; }
    .plate {
      position: relative;
      width: 100%;
      background: #0f0f0d;
      line-height: 0;
      box-shadow: 0 1px 2px rgba(27,24,20,0.04), 0 40px 90px -48px rgba(27,24,20,0.5);
    }
    canvas { width: 100%; height: auto; display: block; }
    .caption { padding-top: 26px; }
    .kicker {
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 16px;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(25px, 5vw, 36px);
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
    }
    .desc {
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink-soft);
      max-width: 62ch;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 26px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .palette { display: inline-flex; gap: 7px; align-items: center; }
    .palette i {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(27,24,20,0.16);
    }
    .back {
      display: inline-block;
      margin-top: 40px;
      font-size: 10.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink);
      border-bottom: 1px solid var(--line);
      padding-bottom: 4px;
      transition: border-color 0.4s ease;
    }
    .back:hover { border-color: var(--ink); }

    /* #stage: frame-only mode used when the piece is embedded (thumbnails, viewing room) */
    html.stage body { padding: 0; display: block; }
    html.stage .page {
      width: 100%;
      max-width: none;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    html.stage .work { width: min(100vw, 100vh); }
    html.stage .plate { width: 100%; box-shadow: none; }
    html.stage .caption,
    html.stage .back { display: none; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
  <script>
    if (location.hash === '#stage') document.documentElement.classList.add('stage');
  </script>
</head>
<body>
  <div class="page">
    <figure class="work">
      <div class="plate">
        <canvas id="artCanvas" width="1024" height="1024"></canvas>
      </div>
      <figcaption class="caption">
        <p class="kicker" id="artAccession">Autonomous Art &middot; Generative</p>
        <h1>Chromatic Phyllotaxis</h1>
        <p class="desc">A living lattice of golden spirals emerges from a singular point, where each new branch is generated by the golden angle, colored by a slow-rotating HSL spectrum, and connected by faint, decaying neural-like bridges.</p>
        <div class="meta-row">
          <span>Phyllotaxis with Neural Diffusion</span>
          <span>Animated</span>
          <span class="palette"><i style="background:#0f0f1a"></i><i style="background:#1a237e"></i><i style="background:#7e57c2"></i><i style="background:#ffcc80"></i><i style="background:#2e7d32"></i></span>
        </div>
      </figcaption>
    </figure>
    <a class="back" href="../../../../index.html">&larr; Return to collection</a>
  </div>

  <script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const colors = ["#0f0f1a","#1a237e","#7e57c2","#ffcc80","#2e7d32"];
    const technique = 'phyllotaxis with neural diffusion';

    // Allow AI models querying document.getElementById('canvas') or 'artCanvas' to succeed
    const _origGetElementById = document.getElementById.bind(document);
    document.getElementById = function(id) {
      if (id === 'canvas' || id === 'artCanvas') return canvas;
      return _origGetElementById(id);
    };

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    
    // --- AI-GENERATED CANVAS CODE (watchdog-guarded) ---
    (function() {
      // The AI writes arbitrary code, so before trusting its output we probe the
      // real canvas pixels. If the code throws OR leaves the canvas effectively
      // blank after a few animation frames, we stop its loop and run the proven
      // procedural engine instead. This prevents silently-deployed black pages.
      const nativeRaf = (typeof window !== 'undefined' && window.requestAnimationFrame)
        ? window.requestAnimationFrame.bind(window)
        : null;

      const frameQueue = [];
      let scheduled = false;
      let phase = 'probing';   // 'probing' -> 'running' (AI kept) | 'fallback'
      let probeFrames = 0;
      let frameTime = 0;
      const PROBE_FRAMES = 12;

      function schedule() {
        if (scheduled || !nativeRaf) return;
        scheduled = true;
        nativeRaf(flush);
      }

      // Intercept rAF so we can count frames for the probe and, when needed,
      // fully stop the AI animation before the fallback engine starts.
      window.requestAnimationFrame = function(cb) {
        frameQueue.push(cb);
        schedule();
        return 0;
      };
      window.cancelAnimationFrame = function() {};

      function flush() {
        scheduled = false;
        frameTime += 16;
        const cbs = frameQueue.splice(0, frameQueue.length);
        for (let i = 0; i < cbs.length; i++) {
          try { cbs[i](frameTime); } catch (e) { console.error('Animation frame error:', e); }
        }
        if (phase === 'probing') {
          probeFrames++;
          if (probeFrames >= PROBE_FRAMES) decide();
        }
        if (phase === 'probing') {
          if (!scheduled) schedule();
        } else if ((phase === 'running' || phase === 'fallback') && frameQueue.length > 0 && !scheduled) {
          schedule();
        }
      }

      function isCanvasBlank() {
        try {
          const img = ctx.getImageData(0, 0, width, height);
          const d = img.data;
          const step = 32;
          for (let y = 0; y < height; y += step) {
            for (let x = 0; x < width; x += step) {
              const i = (y * width + x) * 4;
              // Visible = any non-transparent pixel that is not near-black.
              if (d[i + 3] > 0 && (d[i] + d[i + 1] + d[i + 2]) > 30) return false;
            }
          }
          return true;
        } catch (e) {
          return false; // pixels unreadable (rare); assume the code drew something
        }
      }

      function runFallback(reason) {
        console.log('Falling back to procedural engine (' + reason + ')...');
        phase = 'fallback';
        frameQueue.length = 0; // halt the AI animation loop
        ctx.clearRect(0, 0, width, height);
        // Own scope: declarations can never collide with the AI code's names
        // (a collision would be a parse-time SyntaxError no try/catch can catch).
        (function() {
          
    let n = 0;
    const c = 7;
    const maxPoints = 2500;
    let t = 0;

    function init() {
      ctx.fillStyle = '#040407';
      ctx.fillRect(0, 0, width, height);
      animate();
    }

    function animate() {
      ctx.fillStyle = 'rgba(4, 4, 7, 0.02)';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(width / 2, height / 2);
      ctx.rotate(t * 0.05);

      const goldenAngle = 137.5 * (Math.PI / 180);
      for (let i = 0; i < 60; i++) {
        const idx = (n + i) % maxPoints;
        const a = idx * goldenAngle + t;
        const r = c * Math.sqrt(idx) + Math.sin(idx * 0.1 + t) * 10;
        const x = r * Math.cos(a);
        const y = r * Math.sin(a);

        const color = colors[idx % colors.length];
        ctx.fillStyle = color;
        ctx.beginPath();
        const size = (1 - (r / (width * 0.5))) * 6 + 1;
        ctx.arc(x, y, Math.max(1, size), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      n = (n + 60) % maxPoints;
      t += 0.015;
      requestAnimationFrame(animate);
    }
    
          if (typeof init === 'function') {
            init();
          }
        })();
        if (frameQueue.length > 0 && !scheduled) schedule();
      }

      function decide() {
        if (isCanvasBlank()) {
          runFallback('AI code left the canvas blank');
        } else {
          phase = 'running';
        }
      }

      let customSucceeded = false;
      try {
        // Run the AI code in its own scope so its top-level declarations can
        // never collide with the watchdog's own identifiers.
        (function() {
          // Complete creative HTML5 canvas animation or generative drawing.
// Available in scope: canvas, ctx, width (1024), height (1024), colors (array of 5 hex strings), random(min, max), randomChoice(arr).
// Use requestAnimationFrame for smooth animation, or generate an intricate multi-layered composition.
// Start your animation or drawing immediately.
let angle = 0;
let center = { x: 512, y: 512 };
const goldenAngle = 0.273025984; // 137.5 degrees in radians
const maxRadius = 300;
const layers = [];

function getHue() {
    angle += 0.002;
    return (angle % 1) * 360;
}

function init() {
    for (let i = 0; i < 300; i++) {
        const r = random(0, maxRadius);
        const theta = r * goldenAngle + random(-0.2, 0.2);
        const x = center.x + r * Math.cos(theta);
        const y = center.y + r * Math.sin(theta);
        layers.push({ x, y, r, alpha: 1, age: 0 });
    }
}

function update() {
    // Add new "seeds" occasionally to keep the lattice growing
    if (random() > 0.98) {
        const r = random(0, maxRadius * 0.6);
        const theta = r * goldenAngle + random(-0.2, 0.2);
        layers.push({
            x: center.x + r * Math.cos(theta),
            y: center.y + r * Math.sin(theta),
            r: r,
            alpha: 1,
            age: 0
        });
    }

    // Animate existing points
    for (let i = layers.length - 1; i >= 0; i--) {
        const p = layers[i];
        p.age += 0.05;
        p.alpha = 1 - p.age;
        
        // Subtle breathing motion
        const breath = Math.sin(Date.now() * 0.001 + p.r) * 2;
        
        // Draw the point
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r + breath, 0, Math.PI * 2);
        ctx.fillStyle = colors[Math.floor(random(colors.length))];
        ctx.globalAlpha = p.alpha;
        ctx.fill();
        ctx.globalAlpha = 1;

        // Draw connections to neighbors (simulated neural links)
        // Find points within a certain distance
        const neighbors = layers.filter(n => {
            const dx = n.x - p.x;
            const dy = n.y - p.y;
            return Math.sqrt(dx*dx + dy*dy) < p.r * 1.2 && n !== p;
        });

        for (let n of neighbors) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(n.x, n.y);
            ctx.strokeStyle = `rgba(${getRGBFromHex(colors[1])}, ${p.alpha * 0.3}, ${n.alpha * 0.3})`;
            ctx.stroke();
        }
    }
}

function draw() {
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, width, height);
    ctx.translate(center.x, center.y);
    ctx.rotate(angle); // Rotate the entire system slowly
    
    // Draw the central core
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, Math.PI * 2);
    ctx.fillStyle = colors[0];
    ctx.fill();

    // Draw the lattice
    for (let p of layers) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = colors[Math.floor(random(colors.length))];
        ctx.globalAlpha = p.alpha;
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform
}

// Helper to convert hex to RGB for transparency blending
function getRGBFromHex(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? (
        (parseInt(result[1], 16) << 16) +
        (parseInt(result[2], 16) << 8) +
        parseInt(result[3], 16)
    ) : 0;
}

// Initialize and loop
init();
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
          if (typeof init === 'function') {
            init();
          }
        })();
        customSucceeded = true;
      } catch (err) {
        console.error('Custom AI art execution error:', err);
      }

      if (!customSucceeded) {
        runFallback('AI code threw an error');
      } else if (frameQueue.length === 0) {
        // No animation requested: judge the synchronous drawing right away.
        if (isCanvasBlank()) runFallback('AI code left the canvas blank');
        else phase = 'running';
      } else if (!nativeRaf) {
        phase = 'running'; // can't probe without rAF; keep whatever ran
      } else {
        schedule(); // animate, then probe the pixels after a few frames
      }
    })();
    

    // Accession caption: derive the display date from this file's timestamp.
    try {
      const m = /([0-9]{8})-([0-9]{6})-([^/]+)[.]html$/.exec(location.pathname);
      if (m) {
        const d = new Date(+m[1].slice(0, 4), +m[1].slice(4, 6) - 1, +m[1].slice(6, 8));
        const el = document.getElementById('artAccession');
        if (el) el.textContent = 'Autonomous Art · ' + d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
      }
    } catch (e) {}
  </script>
</body>
</html>
