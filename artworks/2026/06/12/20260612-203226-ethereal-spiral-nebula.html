<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethereal Spiral Nebula - autonomousART</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050505;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      padding: 20px;
    }
    .container { max-width: 1200px; width: 100%; text-align: center; }
    .frame {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
      margin-bottom: 30px;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
    }
    .info {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 16px;
      max-width: 700px;
      margin: 0 auto;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #1a2b3c, #e6d9cf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { font-size: 16px; line-height: 1.7; opacity: 0.9; margin-bottom: 20px; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }
    .tag {
      background: rgba(255,255,255,0.1);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
    }
    .colors {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }
    .swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
    }
    .back {
      display: inline-block;
      margin-top: 25px;
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,0.1);
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 14px;
      transition: all 0.3s;
    }
    .back:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="frame">
      <canvas id="artCanvas" width="1024" height="1024"></canvas>
    </div>

    <div class="info">
      <h1>Ethereal Spiral Nebula</h1>
      <p>A fractal nebula formed through the interplay of complex fractal mathematics and interactive physics.</p>

      <div class="meta">
        <span class="tag">🎨 Interactive Physics</span>
        <span class="tag">🖼️ Animated</span>
      </div>

      <div class="colors">
        <div class="swatch" style="background:#1a2b3c"></div><div class="swatch" style="background:#e6d9cf"></div><div class="swatch" style="background:#445f75"></div><div class="swatch" style="background:#8e8e8e"></div>
      </div>
    </div>

    <a href="../index.html" class="back">← Back to Gallery</a>
  </div>

  <script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    const colors = ["#1a2b3c","#e6d9cf","#445f75","#8e8e8e"];
    const technique = 'interactive physics';

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    
    const bodies = [];
    const G = 0.5;

    class Body {
      constructor() {
        this.x = random(200, canvas.width - 200);
        this.y = random(200, canvas.height - 200);
        this.vx = random(-0.5, 0.5);
        this.vy = random(-0.5, 0.5);
        this.mass = random(10, 50);
        this.color = randomChoice(colors);
        this.trail = [];
      }

      update() {
        for (let other of bodies) {
          if (other === this) continue;
          const dx = other.x - this.x, dy = other.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > 5) {
            const force = G * this.mass * other.mass / (dist * dist);
            this.vx += (dx / dist) * force / this.mass;
            this.vy += (dy / dist) * force / this.mass;
          }
        }
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 50) this.trail.shift();
      }

      draw() {
        ctx.beginPath();
        ctx.strokeStyle = this.color;
        ctx.globalAlpha = 0.3;
        ctx.lineWidth = 2;
        for (let i = 0; i < this.trail.length; i++) {
          const p = this.trail[i];
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        ctx.beginPath();
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 1;
        ctx.arc(this.x, this.y, this.mass / 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function init() {
      for (let i = 0; i < 20; i++) bodies.push(new Body());
      animate();
    }

    function animate() {
      ctx.fillStyle = 'rgba(5, 5, 10, 0.15)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      bodies.forEach(b => { b.update(); b.draw(); });
      requestAnimationFrame(animate);
    }
    

    init();
  </script>
</body>
</html>
