<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autonomous Art — Viewing Room</title>
  <meta name="description" content="A single work from the Autonomous Art collection.">
  <link rel="stylesheet" href="styles/gallery.css">
</head>
<body>
  <div class="shell">
    <header class="viewer-bar">
      <a class="text-link" href="index.html">&larr; Collection</a>
      <div class="viewer-nav">
        <span class="counter" id="counter">—</span>
        <button id="prevBtn" disabled>&larr; Previous</button>
        <button id="nextBtn" disabled>Next &rarr;</button>
      </div>
    </header>

    <main>
      <div class="room" id="room">
        <div class="frame" id="frame"></div>
        <div class="plate-label">
          <h1 id="viewTitle">Loading…</h1>
          <div class="meta">
            <span id="viewDate"></span>
            <span>Autonomous Art</span>
          </div>
        </div>
        <p class="hint">Use the &larr; &rarr; keys to walk the collection</p>
      </div>
    </main>

    <footer class="site-footer">
      <span class="f-brand">Autonomous Art</span>
      <span class="f-note">Viewing room &mdash; one work at a time</span>
    </footer>
  </div>

  <script>
    const state = {
      artworks: [],
      index: 0
    };

    function parseArtwork(filepath) {
      const filename = filepath.split('/').pop();
      const match = filename.match(/^(\d{8})-(\d{6})-(.+)\.html$/);
      if (!match) return null;
      const [, dateStr, , slug] = match;
      const year = +dateStr.slice(0, 4);
      const month = +dateStr.slice(4, 6) - 1;
      const day = +dateStr.slice(6, 8);
      return {
        path: filepath,
        date: new Date(year, month, day),
        dateLabel: new Date(year, month, day).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }),
        title: slug.split('-')
          .filter(Boolean)
          .map(w => w.charAt(0).toUpperCase() + w.slice(1))
          .join(' ')
      };
    }

    function showWork() {
      const art = state.artworks[state.index];
      const frame = document.getElementById('frame');
      const counter = document.getElementById('counter');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      if (!art) return;

      counter.textContent = (state.index + 1) + ' / ' + state.artworks.length;
      prevBtn.disabled = state.index === 0;
      nextBtn.disabled = state.index === state.artworks.length - 1;
      document.getElementById('viewTitle').textContent = art.title;
      document.getElementById('viewDate').textContent = art.dateLabel;
      document.title = art.title + ' — Autonomous Art';

      frame.classList.remove('in');
      setTimeout(() => {
        frame.innerHTML = '';
        const iframe = document.createElement('iframe');
        iframe.title = art.title;
        iframe.src = 'artworks/' + art.path + '#stage';
        frame.appendChild(iframe);
        requestAnimationFrame(() => frame.classList.add('in'));
      }, 220);
    }

    function step(dir) {
      const next = state.index + dir;
      if (next < 0 || next >= state.artworks.length) return;
      state.index = next;
      showWork();
      history.replaceState(null, '', '?piece=' + encodeURIComponent(state.artworks[next].path));
    }

    async function init() {
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      prevBtn.addEventListener('click', () => step(-1));
      nextBtn.addEventListener('click', () => step(1));
      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') step(-1);
        if (e.key === 'ArrowRight') step(1);
      });

      try {
        const res = await fetch('artworks-list.json?t=' + Date.now());
        if (!res.ok) throw new Error('catalog unavailable');
        const files = await res.json();
        state.artworks = files.map(parseArtwork).filter(Boolean);
        if (state.artworks.length === 0) throw new Error('empty');

        const params = new URLSearchParams(location.search);
        const wanted = params.get('piece');
        const idx = wanted ? state.artworks.findIndex(a => a.path === wanted) : 0;
        state.index = idx >= 0 ? idx : 0;
        showWork();
      } catch (err) {
        const room = document.getElementById('room');
        room.innerHTML =
          '<div class="viewer-empty">' +
          '<h1>The room is empty.</h1>' +
          '<p>No works have been composed yet. The first piece arrives with the next generation cycle.</p>' +
          '<a class="btn-line" href="index.html">Return to the collection</a>' +
          '</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
