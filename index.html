<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>autonomousART - AI Generative Art</title>
  <meta name="description" content="Experience the latest AI-generated art. New pieces every 6 hours.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Art Display */
    .art-display {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .art-display iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    /* UI Overlay */
    .ui-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px;
      background: linear-gradient(to bottom, 
        rgba(0, 0, 0, 0.5) 0%, 
        transparent 15%, 
        transparent 70%, 
        rgba(0, 0, 0, 0.7) 100%);
      z-index: 10;
    }

    .top-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: auto;
      gap: 30px;
    }

    .logo {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #00d4ff, #7209b7, #f72585);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
      white-space: nowrap;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Info Panel */
    .info-panel {
      align-self: flex-start;
      max-width: 500px;
      pointer-events: auto;
    }

    .info-card {
      background: rgba(10, 10, 15, 0.7);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    .artwork-title {
      font-size: 32px;
      font-weight: 300;
      margin-bottom: 12px;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .artwork-meta {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 18px;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .artwork-description {
      font-size: 13px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.6);
    }

    /* Loading State */
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 50;
      pointer-events: auto;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top: 2px solid #f72585;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    .loading-text {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeIn 0.6s ease-out;
    }

    /* Error State */
    .error-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
    }

    .error-card {
      background: rgba(255, 0, 0, 0.05);
      border: 1px solid rgba(255, 100, 100, 0.3);
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      max-width: 400px;
    }

    .error-card h2 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #ff9999;
    }

    .error-card p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 20px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .ui-overlay {
        padding: 24px;
      }

      .top-section {
        flex-wrap: wrap;
        gap: 16px;
      }

      .controls {
        order: -1;
        width: 100%;
        justify-content: flex-start;
      }

      .info-panel {
        width: 100%;
        max-width: none;
      }

      .info-card {
        padding: 20px;
      }

      .artwork-title {
        font-size: 24px;
      }

      .btn {
        padding: 8px 16px;
        font-size: 12px;
      }

      .logo {
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
      }
      
      .fade-in {
        animation: none;
      }

      .btn {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="art-display" id="artDisplay">
      <div class="loading">
        <div class="spinner"></div>
        <p class="loading-text">Loading latest artwork...</p>
      </div>
    </div>

    <div class="ui-overlay" id="overlay" style="display: none;">
      <div class="top-section">
        <div class="logo">autonomousART</div>
        <div class="controls">
          <a href="gallery.html" class="btn">
            <span>📚</span>
            <span>View Gallery</span>
          </a>
          <button class="btn" onclick="location.reload();">
            <span>🔄</span>
            <span>Refresh</span>
          </button>
        </div>
      </div>

      <div class="info-panel">
        <div class="info-card fade-in">
          <h1 class="artwork-title" id="artTitle">Loading...</h1>
          <div class="artwork-meta">
            <div class="meta-item">
              <span>🤖</span>
              <span>AI Generated</span>
            </div>
            <div class="meta-item" id="artDate">Today</div>
          </div>
          <p class="artwork-description" id="artDesc">
            This artwork was autonomously generated using Ollama-based AI inference.
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function loadLatestArt() {
      try {
        const bustParam = `?t=${Date.now()}`;
        const response = await fetch('artworks-list.json' + bustParam);
        if (!response.ok) throw new Error('Failed to fetch artwork list');

        const artworks = await response.json();
        if (artworks.length === 0) throw new Error('No artworks found');

        const latestFile = artworks[0];
         
         // Extract just the filename from the path (handles nested directories)
         const filename = latestFile.split('/').pop();
         
         // Parse metadata from filename (format: YYYYMMDD-HHMMSS-title.html)
         const match = filename.match(/^(\d{8})-(\d{6})-(.+)\.html$/);
         if (!match) throw new Error('Invalid artwork filename format');
         
         const [, dateStr, timeStr, slug] = match;
         const title = slug
           .split('-')
           .map(w => w.charAt(0).toUpperCase() + w.slice(1))
           .join(' ');

        // Format date
        const year = dateStr.substring(0, 4);
        const month = dateStr.substring(4, 6);
        const day = dateStr.substring(6, 8);
        const date = new Date(year, parseInt(month) - 1, day);
        const dateFormatted = date.toLocaleDateString('en-US', { 
          weekday: 'long', 
          year: 'numeric', 
          month: 'long', 
          day: 'numeric' 
        });

        // Load artwork in iframe
        const display = document.getElementById('artDisplay');
        display.innerHTML = `<iframe src="artworks/${latestFile}" allow="autoplay; encrypted-media"></iframe>`;

        // Update overlay
        document.getElementById('artTitle').textContent = title;
        document.getElementById('artDate').textContent = dateFormatted;
        document.getElementById('artDesc').textContent = 
          'This artwork was autonomously generated using Ollama-based AI inference. Every generation is unique.';
        
        // Show overlay
        document.getElementById('overlay').style.display = 'flex';

      } catch (error) {
        const display = document.getElementById('artDisplay');
        display.innerHTML = `
          <div class="error-container">
            <div class="error-card">
              <h2>Unable to load artwork</h2>
              <p>${error.message}</p>
              <button class="btn" onclick="location.reload();" style="pointer-events: auto;">
                Retry
              </button>
            </div>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadLatestArt);
  </script>
</body>
</html>
