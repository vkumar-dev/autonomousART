name: Ollama Image Generation

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Description of the art to generate'
        required: true
        default: 'a beautiful abstract digital art with vibrant colors, fractal patterns, cosmic nebula'
      model:
        description: 'Ollama image generation model'
        required: true
        default: 'stable-diffusion'
        type: choice
        options:
          - stable-diffusion
          - flux
          - playground-v2.5
      count:
        description: 'Number of images to generate'
        required: false
        default: '1'
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write

jobs:
  generate-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Ollama
        run: |
          echo "📦 Installing Ollama..."
          curl -fsSL https://ollama.ai/install.sh | sh
          echo "✅ Ollama installed"

      - name: Start Ollama service
        run: |
          echo "🚀 Starting Ollama service..."
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          OLLAMA_PID=$!
          echo "Ollama PID: $OLLAMA_PID"

          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama ready"
              break
            fi
            echo "⏳ Waiting... ($i/30)"
            sleep 2
          done

      - name: Pull image generation model
        timeout-minutes: 20
        run: |
          MODEL="${{ github.event.inputs.model || 'stable-diffusion' }}"
          echo "📥 Pulling $MODEL model..."
          timeout 1200 ollama pull $MODEL || {
            echo "⚠️  Trying fallback model..."
            ollama pull stable-diffusion
          }
          ollama list

      - name: Generate art concept with Ollama (text model)
        timeout-minutes: 10
        env:
          OLLAMA_URL: http://localhost:11434
          OLLAMA_MODEL: mistral
        run: |
          echo "🎨 Generating art concept..."
          
          # Try to pull a lightweight text model for concept generation
          ollama pull mistral || ollama pull llama3.2 || ollama pull tinyllama || true
          
          node scripts/ollama-concept-generator.js || echo "⚠️  Concept generation skipped"

      - name: Generate images with Ollama
        timeout-minutes: 15
        run: |
          echo "🖼️  Generating images with Ollama image model..."
          
          # Get prompt from workflow input or use default
          if [ -n "${{ github.event.inputs.prompt }}" ]; then
            PROMPT="${{ github.event.inputs.prompt }}"
          elif [ -f selected-concept.json ]; then
            PROMPT=$(node -e "const c=require('./selected-concept.json'); console.log(c.concept + ' ' + c.tone)")
          else
            PROMPT="abstract generative art with vibrant colors, fractal patterns, cosmic nebula, digital art"
          fi
          
          MODEL="${{ github.event.inputs.model || 'stable-diffusion' }}"
          COUNT="${{ github.event.inputs.count || 1 }}"
          
          echo "📝 Prompt: $PROMPT"
          echo "🤖 Model: $MODEL"
          echo "🔢 Count: $COUNT"
          
          # Create output directory
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          OUTPUT_DIR="generated-images/$TIMESTAMP"
          mkdir -p "$OUTPUT_DIR"
          
          # Generate images using Ollama API
          for i in $(seq 1 $COUNT); do
            echo "🎨 Generating image $i of $COUNT..."
            
            # Call Ollama's generate API for image generation
            RESPONSE=$(curl -s -X POST http://localhost:11434/api/generate \
              -H "Content-Type: application/json" \
              -d "{
                \"model\": \"$MODEL\",
                \"prompt\": \"$PROMPT\",
                \"stream\": false
              }")
            
            # Extract base64 image from response
            IMAGE_DATA=$(echo "$RESPONSE" | node -e "let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.image||j.b64||'')}catch(e){console.log('')}})" 2>/dev/null)
            
            if [ -n "$IMAGE_DATA" ]; then
              echo "$IMAGE_DATA" | base64 -d > "$OUTPUT_DIR/art_${TIMESTAMP}_${i}.png"
              echo "✅ Image $i saved: $OUTPUT_DIR/art_${TIMESTAMP}_${i}.png"
            else
              echo "⚠️  Failed to generate image $i"
              echo "Response: $RESPONSE"
            fi
          done
          
          # Save metadata
          cat > "$OUTPUT_DIR/metadata.json" << EOF
          {
            "prompt": "$PROMPT",
            "model": "$MODEL",
            "count": $COUNT,
            "timestamp": "$TIMESTAMP",
            "generated_by": "github-actions"
          }
          EOF
          
          echo "✅ Generated $COUNT image(s) in $OUTPUT_DIR"

      - name: Upload generated images
        uses: actions/upload-artifact@v4
        with:
          name: ollama-generated-art
          path: generated-images/
          retention-days: 30

      - name: Commit and push generated art
        run: |
          git config user.name 'autonomousART Bot'
          git config user.email 'autonomousart@github-actions.local'
          
          git add generated-images/
          
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit"
            exit 0
          fi
          
          PROMPT_SUMMARY="${{ github.event.inputs.prompt }}"
          if [ -z "$PROMPT_SUMMARY" ]; then
            PROMPT_SUMMARY="automated generation"
          fi
          
          git commit -m "🎨 [OLLAMA] Generated art: ${PROMPT_SUMMARY:0:50}..."
          
          if git push origin main; then
            echo "✅ Pushed successfully"
          else
            git pull --rebase origin main
            git push origin main
          fi

      - name: Summary
        if: always()
        run: |
          echo "📊 Workflow Complete"
          echo "   Model: ${{ github.event.inputs.model || 'stable-diffusion' }}"
          echo "   Images: ${{ github.event.inputs.count || 1 }}"
          if [ -d "generated-images" ]; then
            echo "   Output: $(ls -1 generated-images/ 2>/dev/null | head -1)"
          fi
