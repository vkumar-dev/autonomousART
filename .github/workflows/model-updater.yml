name: Model Updater Bot

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly, Sunday midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-test-models:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Ollama
        run: |
          echo "📦 Installing Ollama..."
          curl -fsSL https://ollama.ai/install.sh | sh
          echo "✅ Ollama installed"

      - name: Start Ollama service
        run: |
          echo "🚀 Starting Ollama service..."
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          OLLAMA_PID=$!
          echo "OLLAMA_PID=$OLLAMA_PID" >> $GITHUB_ENV
          
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama ready"
              break
            fi
            echo "⏳ Waiting... ($i/30)"
            sleep 2
          done

      - name: Search for latest models
        run: |
          echo "🔍 Searching HuggingFace for latest models..."
          node scripts/model-updater.js --search-only

      - name: Pull candidate models
        timeout-minutes: 20
        run: |
          echo "📥 Pulling candidate models for testing..."
          # Extract candidate models from models.staging.json
          node -e "
            const fs = require('fs');
            const staging = JSON.parse(fs.readFileSync('models.staging.json', 'utf8'));
            staging.candidates.forEach(c => {
              console.log('Pulling: ' + c.name);
              require('child_process').spawnSync('ollama', ['pull', c.name], {stdio: 'inherit'});
            });
          "

      - name: Test candidate models
        timeout-minutes: 15
        env:
          OLLAMA_URL: http://localhost:11434
        run: |
          echo "🧪 Testing candidate models..."
          node scripts/model-updater.js --test-only

      - name: Check test results
        run: |
          echo "📊 Checking test results..."
          node -e "
            const fs = require('fs');
            if (fs.existsSync('models.staging.json')) {
              const staging = JSON.parse(fs.readFileSync('models.staging.json', 'utf8'));
              console.log('Status: ' + staging.status);
              if (staging.status === 'failed') {
                console.log('❌ Tests failed, will not update models');
                process.exit(1);
              }
            }
          "

      - name: Promote verified models
        if: success()
        run: |
          echo "✅ Promoting verified models to production..."
          node scripts/model-updater.js --promote

      - name: Show model config
        if: always()
        run: |
          echo "📋 Current model configuration:"
          cat models.config.json

      - name: Commit changes
        if: success()
        run: |
          git config user.name 'Model Updater Bot'
          git config user.email 'model-updater@github-actions.local'
          
          if git diff --quiet models.config.json; then
            echo "ℹ️  No model changes to commit"
            exit 0
          fi
          
          git add models.config.json models.staging.json model-update-log.json
          git commit -m "🤖 [AUTO] Update models: $(date -u +%Y-%m-%d)"
          
          if git push origin master; then
            echo "✅ Pushed model updates"
          else
            git pull --rebase origin master
            git push origin master || echo "⚠️  Push conflict, continuing..."
          fi

      - name: Summary
        if: always()
        run: |
          echo "📊 Model Update Workflow Complete"
          if [ -f model-update-log.json ]; then
            echo "Recent updates:"
            node -e "
              const logs = JSON.parse(require('fs').readFileSync('model-update-log.json', 'utf8'));
              if (logs.length > 0) {
                const latest = logs[logs.length - 1];
                console.log('  Primary: ' + latest.newPrimary);
                console.log('  Fallback: ' + latest.newFallback);
              }
            "
          fi
