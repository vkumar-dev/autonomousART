name: Generate Art

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Description of the art to generate'
        required: false
        default: 'abstract cosmic nebula with vibrant colors, fractal patterns, digital art'
      style:
        description: 'Art style'
        required: false
        default: 'abstract'
        type: choice
        options:
          - abstract
          - fractal
          - geometric
          - particle

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Ollama
        run: |
          echo "📦 Installing Ollama..."
          curl -fsSL https://ollama.ai/install.sh | sh
          echo "✅ Ollama installed"

      - name: Start Ollama service
        run: |
          echo "🚀 Starting Ollama service..."
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama ready"
              break
            fi
            sleep 2
          done

      - name: Pull text model for concept generation
        timeout-minutes: 15
        run: |
          echo "📥 Pulling qwen2.5-coder:3b for concept generation..."
          ollama pull qwen2.5-coder:3b
          ollama list

      - name: Generate art concept with Ollama
        timeout-minutes: 10
        continue-on-error: true
        env:
          OLLAMA_URL: http://localhost:11434
          OLLAMA_MODEL: qwen2.5-coder:3b
        run: |
          echo "🎨 Generating art concept with Ollama..."
          node scripts/ollama-concept-generator.js || echo "⚠️ Concept generation failed, using fallback"

      - name: Generate artwork (Canvas-based)
        run: |
          echo "🖼️  Generating canvas art..."
          node scripts/art-generator.js

      - name: Build gallery
        run: |
          echo "📋 Building gallery..."
          node scripts/build-gallery.js

      - name: Configure Git
        run: |
          git config user.name 'autonomousART Bot'
          git config user.email 'autonomousart@github-actions.local'

      - name: Commit artwork
        run: |
          git add artworks/ artworks-list.json concept-history.json

          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit"
            exit 0
          fi

          PROMPT_SUMMARY="${{ github.event.inputs.prompt }}"
          if [ -z "$PROMPT_SUMMARY" ]; then
            PROMPT_SUMMARY="autonomous generation"
          fi

          git commit -m "🎨 [AUTO] New artwork: ${PROMPT_SUMMARY:0:50}..."

          if git push origin master; then
            echo "✅ Pushed successfully"
          else
            git pull --rebase origin master
            git push origin master
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        if: always()
        run: |
          echo "📊 Workflow Complete"
          echo "   Style: ${{ github.event.inputs.style || 'abstract' }}"
          echo "   Deployed: ${{ steps.deployment.outputs.page_url }}"
