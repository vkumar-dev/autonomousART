name: Generate Art

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate art concept
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "🎨 Generating art concept..."
          node scripts/concept-selector.js

      - name: Generate artwork
        run: |
          echo "🖼️  Generating artwork..."
          node scripts/art-generator.js

      - name: Build gallery
        run: |
          echo "📋 Building gallery..."
          node scripts/build-gallery.js

      - name: Configure Git
        run: |
          git config user.name 'autonomousART Bot'
          git config user.email 'autonomousart@github-actions.local'

      - name: Commit artwork
        run: |
          git add artworks/ artworks-list.json concept-history.json
          
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit"
            exit 0
          fi
          
          git commit -m "🎨 [AUTO] New artwork: $(date -u +%Y-%m-%d)"
          
          if git push origin master; then
            echo "✅ Artwork committed and pushed"
          else
            echo "⚠️  Push failed, attempting rebase"
            git pull --rebase origin master
            git push origin master
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        if: always()
        run: |
          echo "📊 Workflow Summary"
          echo "   Status: Complete"
          echo "   Deployed to: ${{ steps.deployment.outputs.page_url }}"
