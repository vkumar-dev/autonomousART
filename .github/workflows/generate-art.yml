name: Generate Art

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Description of the art to generate'
        required: false
        default: 'abstract cosmic nebula with vibrant colors, fractal patterns, digital art'
      style:
        description: 'Art style'
        required: false
        default: 'abstract'
        type: choice
        options:
          - abstract
          - fractal
          - geometric
          - particle

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      HF_HOME: ${{ github.workspace }}/.hf
      LLAMA_MODEL_DIR: ${{ github.workspace }}/.models
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      MODEL_MIN_PARAMS: "3B"
      MODEL_MAX_PARAMS: "7B"
      LLAMA_MAX_TOKENS: "3072"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/hf" --version

      - name: Install Python inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu || pip install llama-cpp-python

      - name: Install Node.js dependencies
        run: npm install

      - name: Discover public non-gated GGUF model
        id: model
        run: |
          echo "Selecting latest suitable open non-gated llama.cpp model…"
          python scripts/model_resolver.py | tee resolver-output.json
          MODEL_ID=$(python -c "import json; print(json.load(open('selected-model.json'))['model'])")
          QUANT=$(python -c "import json; print(json.load(open('selected-model.json'))['quantization'])")
          echo "model=$MODEL_ID" >> "$GITHUB_OUTPUT"
          echo "quant=$QUANT" >> "$GITHUB_OUTPUT"
          echo "Selected $MODEL_ID ($QUANT)"

      - name: Cache GGUF weights
        uses: actions/cache@v4
        with:
          path: |
            .models
            .hf
          key: ${{ runner.os }}-gguf-${{ hashFiles('selected-model.json') }}
          restore-keys: |
            ${{ runner.os }}-gguf-

      - name: Generate art concept with local HF GGUF inference
        timeout-minutes: 30
        run: |
          echo "🎨 Generating art concept with HF GGUF model..."
          node scripts/concept-generator.js

      - name: Generate artwork (Canvas-based)
        run: |
          echo "🖼️  Generating canvas art..."
          node scripts/art-generator.js

      - name: Build gallery
        run: |
          echo "📋 Building gallery..."
          node scripts/build-gallery.js

      - name: Configure Git
        run: |
          git config user.name 'autonomousART Bot'
          git config user.email 'autonomousart@github-actions.local'

      - name: Commit artwork
        run: |
          git add artworks/ artworks-list.json concept-history.json
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit"
            exit 0
          fi

          PROMPT_SUMMARY="${{ github.event.inputs.prompt }}"
          if [ -z "$PROMPT_SUMMARY" ]; then
            PROMPT_SUMMARY="autonomous generation"
          fi

          git commit -m "🎨 [AUTO] New artwork: ${PROMPT_SUMMARY:0:50}... ($(date -u +%Y-%m-%d))"

          if git push origin master; then
            echo "✅ Pushed successfully"
          else
            git pull --rebase origin master
            git push origin master
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        if: always()
        run: |
          echo "📊 Workflow Complete"
          echo "   Model: ${{ steps.model.outputs.model }}"
          echo "   Quant: ${{ steps.model.outputs.quant }}"
          echo "   Style: ${{ github.event.inputs.style || 'abstract' }}"
          echo "   Deployed: ${{ steps.deployment.outputs.page_url }}"
