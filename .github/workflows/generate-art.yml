name: Generate Art

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Description of the art to generate'
        required: false
        default: 'abstract cosmic nebula with vibrant colors, fractal patterns, digital art'
      model:
        description: 'Ollama image generation model'
        required: false
        default: 'stable-diffusion'
        type: choice
        options:
          - stable-diffusion
          - flux
          - playground-v2.5

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Ollama
        run: |
          echo "📦 Installing Ollama..."
          curl -fsSL https://ollama.ai/install.sh | sh
          echo "✅ Ollama installed"

      - name: Start Ollama service
        run: |
          echo "🚀 Starting Ollama service..."
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          OLLAMA_PID=$!
          echo "Ollama PID: $OLLAMA_PID"

          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama ready"
              break
            fi
            echo "⏳ Waiting... ($i/30)"
            sleep 2
          done

      - name: Pull image generation model
        timeout-minutes: 20
        run: |
          MODEL="${{ github.event.inputs.model || 'stable-diffusion' }}"
          echo "📥 Pulling $MODEL model..."
          timeout 1200 ollama pull $MODEL || {
            echo "⚠️  Trying fallback model..."
            ollama pull stable-diffusion
          }
          ollama list

      - name: Generate art concept (optional text prompt)
        timeout-minutes: 10
        continue-on-error: true
        env:
          OLLAMA_URL: http://localhost:11434
          OLLAMA_MODEL: tinyllama
        run: |
          echo "🎨 Generating art concept..."
          ollama pull tinyllama || true
          node scripts/ollama-concept-generator.js || echo "⚠️  Concept generation skipped"

      - name: Generate image with Ollama
        timeout-minutes: 15
        run: |
          echo "🖼️  Generating image with Ollama..."
          
          # Get prompt from workflow input or use concept
          if [ -n "${{ github.event.inputs.prompt }}" ]; then
            PROMPT="${{ github.event.inputs.prompt }}"
          elif [ -f selected-concept.json ]; then
            PROMPT=$(node -e "const c=require('./selected-concept.json'); console.log(c.concept + ' ' + c.tone)" 2>/dev/null || echo "abstract cosmic art")
          else
            PROMPT="abstract cosmic nebula with vibrant colors, fractal patterns, digital art"
          fi
          
          MODEL="${{ github.event.inputs.model || 'stable-diffusion' }}"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          echo "📝 Prompt: $PROMPT"
          echo "🤖 Model: $MODEL"
          
          # Create dated folder structure
          YEAR=$(date +%Y)
          MONTH=$(date +%m)
          DAY=$(date +%d)
          ARTWORK_DIR="artworks/$YEAR/$MONTH/$DAY"
          mkdir -p "$ARTWORK_DIR"
          
          # Generate image using Ollama API
          echo "🎨 Generating..."
          RESPONSE=$(curl -s -X POST http://localhost:11434/api/generate \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"$MODEL\",
              \"prompt\": \"$PROMPT\",
              \"stream\": false
            }")
          
          # Extract base64 image from response
          IMAGE_DATA=$(echo "$RESPONSE" | node -e "
            let d='';
            process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try{
                const j=JSON.parse(d);
                console.log(j.image||j.b64||'');
              }catch(e){console.log('')}
            })" 2>/dev/null)
          
          if [ -n "$IMAGE_DATA" ]; then
            FILENAME="art_${TIMESTAMP}.png"
            echo "$IMAGE_DATA" | base64 -d > "$ARTWORK_DIR/$FILENAME"
            echo "✅ Image saved: $ARTWORK_DIR/$FILENAME"
            
            # Save metadata
            cat > "$ARTWORK_DIR/metadata_${TIMESTAMP}.json" << EOF
            {
              "title": "Generated Art ${TIMESTAMP}",
              "prompt": "$PROMPT",
              "model": "$MODEL",
              "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "file": "$FILENAME"
            }
            EOF
          else
            echo "⚠️  Generation failed, using fallback"
            echo "Response: $RESPONSE"
            exit 1
          fi

      - name: Build gallery
        run: |
          echo "📋 Building gallery..."
          node scripts/build-gallery.js || echo "⚠️  Gallery build skipped"

      - name: Configure Git
        run: |
          git config user.name 'autonomousART Bot'
          git config user.email 'autonomousart@github-actions.local'

      - name: Commit artwork
        run: |
          git add artworks/
          
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit"
            exit 0
          fi
          
          PROMPT_SUMMARY="${{ github.event.inputs.prompt }}"
          if [ -z "$PROMPT_SUMMARY" ]; then
            PROMPT_SUMMARY="autonomous generation"
          fi
          
          git commit -m "🎨 [AUTO] New artwork: ${PROMPT_SUMMARY:0:50}..."
          
          if git push origin master; then
            echo "✅ Pushed successfully"
          else
            git pull --rebase origin master
            git push origin master
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        if: always()
        run: |
          echo "📊 Workflow Complete"
          echo "   Model: ${{ github.event.inputs.model || 'stable-diffusion' }}"
          echo "   Deployed: ${{ steps.deployment.outputs.page_url }}"
