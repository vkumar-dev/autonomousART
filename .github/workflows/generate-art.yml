name: Generate Art

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Ollama
        run: |
          echo "📦 Installing Ollama..."
          curl -fsSL https://ollama.ai/install.sh | sh
          echo "✅ Ollama installed"

      - name: Start Ollama service
        run: |
          echo "🚀 Starting Ollama service..."
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          OLLAMA_PID=$!
          echo "OLLAMA_PID=$OLLAMA_PID" >> $GITHUB_ENV
          echo "Ollama PID: $OLLAMA_PID"
          
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama ready"
              break
            fi
            echo "⏳ Waiting... ($i/30)"
            sleep 2
          done

      - name: Pull Ollama model
        timeout-minutes: 10
        run: |
          echo "📥 Pulling mistral model..."
          timeout 600 ollama pull mistral || {
            echo "⚠️  Trying llama3.2..."
            timeout 400 ollama pull llama3.2 || {
              echo "⚠️  Trying tinyllama..."
              timeout 200 ollama pull tinyllama || true
            }
          }
          ollama list

      - name: Generate art concept with Ollama
        timeout-minutes: 10
        env:
          OLLAMA_URL: http://localhost:11434
          OLLAMA_MODEL: mistral
        run: |
          echo "🎨 Generating concept with Ollama..."
          node scripts/ollama-concept-generator.js

      - name: Generate artwork
        run: |
          echo "🖼️  Generating canvas art..."
          node scripts/art-generator.js

      - name: Build gallery
        run: |
          echo "📋 Building gallery..."
          node scripts/build-gallery.js

      - name: Configure Git
        run: |
          git config user.name 'autonomousART Bot'
          git config user.email 'autonomousart@github-actions.local'

      - name: Commit artwork
        run: |
          git add artworks/ artworks-list.json concept-history.json
          
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit"
            exit 0
          fi
          
          git commit -m "🎨 [AUTO] New artwork: $(date -u +%Y-%m-%d)"
          
          if git push origin master; then
            echo "✅ Pushed successfully"
          else
            git pull --rebase origin master
            git push origin master
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        if: always()
        run: |
          echo "📊 Workflow Complete"
          echo "   Deployed: ${{ steps.deployment.outputs.page_url }}"
